name: 무게중심-정삼각형
source_id: 고쟁이-CH01-STEP2-#025
tier: star_5
mechanism_primary: "무게중심 2:1 성질 + 정삼각형 높이 공식으로 변 길이 역산"
mechanism_secondary:
  - "정삼각형에서 무게중심·외심·내심·수심 일치"
  - "정삼각형 높이 h = (√3/2)·변"
unit_code: CM2-GM
description: "정삼각형 ABC의 한 꼭짓점 A와 무게중심 G의 좌표가 주어졌을 때 삼각형 ABC의 둘레 길이를 구함."

parameters:
  A_x: {range: [-6, 6], type: integer, exclude: [0]}
  A_y: {range: [-6, 6], type: integer, exclude: [0]}
  G_x: {range: [-6, 6], type: integer}
  G_y: {range: [-6, 6], type: integer}

constraints:
  - "A != G"
  - "AG_squared = (A_x - G_x)^2 + (A_y - G_y)^2 > 0"
  - "AG_squared is a positive integer"
  # 정삼각형 변 길이 = (2/√3) · AM = (2/√3) · (3/2) · AG = √3 · AG
  # 둘레 = 3 · √3 · AG = 3√3 · AG
  # AG가 무리수라도 계산 가능. 하지만 답이 깔끔하려면 AG²가 3의 배수 or 완전제곱

answer_formula: |
  AG_squared = (A_x - G_x)**2 + (A_y - G_y)**2
  AG = sqrt(AG_squared)
  perimeter = 3 * sqrt(3) * AG    # = 3·√(3·AG²)

prompt_template: |
  좌표평면 위의 점 $\mathrm{A}({{A_x}},\,{{A_y}})$를 한 꼭짓점으로 하는 정삼각형 $\mathrm{ABC}$의 무게중심의 좌표가 $({{G_x}},\,{{G_y}})$일 때, 삼각형 $\mathrm{ABC}$의 둘레의 길이는?

variation_notes_template: "무게중심 정삼각형 · A({{A_x}},{{A_y}}) · G({{G_x}},{{G_y}}) · AG²={{AG_squared}} · 둘레=3√{3·AG²}"

verified_seeds:
  - {seed: 1, A_x: 3, A_y: 5, G_x: -1, G_y: 2, AG_squared: 25, perimeter: "15√3", source_ref: "원본 #025"}
  - {seed: 2, A_x: 4, A_y: 3, G_x: -2, G_y: -3, AG_squared: 72, perimeter: "18√6", source_ref: "DeeP-Red 1회 #2 변형"}
