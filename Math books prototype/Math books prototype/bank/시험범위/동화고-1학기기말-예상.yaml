# 동화고 1학년 1학기 기말 예상 시험지 — 시험범위 정밀 명세
# 단일 출처: 마스터 명시 2026-06-25 (7회차 진단 후 정정 v1.1)
#
# 마스터 발언:
#   "시험범위는 여러 가지 방정식부터 행렬이야. 즉 고차방정식부터 인데
#    시험지에는 복소수부터 이차방정식까지 다 들어가있어."
#   "이차부등식은 부등식이잖아. 부등식은 시험범위야.
#    교재마다 목차만 봐도 명확한 거를 아직도 분석을 제대로 안 한 거잖아."
#
# 본 명세는 *교과서 목차 기반*. 단원 절(節) 단위가 단일 출처.

series: 동화고-1학기기말-예상
school: 동화고등학교
grade: 고1
semester: 1학기 2차 지필평가

# ─────────────────────────────────────────────────────────────
# 교과서 목차 출처 (시험범위 명세의 근거)
# ─────────────────────────────────────────────────────────────

textbook_outline:
  source: 2022 개정 교육과정 공통수학1 표준 목차 (출판사 공통)
  units:
    - id: CM1-PL
      name: 다항식
      sections: [다항식의 연산, 항등식과 나머지정리, 인수분해]
    - id: CM1-EQ
      name: 방정식과 부등식
      sections:
        - 복소수
        - 이차방정식
        - 이차방정식과 이차함수
        - 여러 가지 방정식
        - 여러 가지 부등식
    - id: CM1-CB
      name: 경우의 수
      sections: [순열, 조합]
    - id: CM1-MX
      name: 행렬과 그 연산
      sections: [행렬의 정의·연산, 행렬의 거듭제곱]

# ─────────────────────────────────────────────────────────────
# 시험범위 (절 수준)
# ─────────────────────────────────────────────────────────────

allowed_sections:
  - unit: CM1-EQ
    section: 여러 가지 방정식
    section_id: EQ-multi-eq
    topics:
      - 삼차방정식 (인수정리·조립제법 활용)
      - 사차방정식 (인수분해·복이차 치환)
      - 연립이차방정식
      - 켤레무리수 근 (단일 무리수 a+b√c, 유리수 계수)
      - 켤레허수 근 (a+bi, 유리수 계수) — 사차·삼차 방정식의 *도구*로 허용
      - "ω 활용 (1의 3제곱근, ω²+ω+1=0, ω³=1) — 고차방정식 표준 유형"
      - 삼차방정식 중근 조건 (인수정리 + 미정계수)
      - 사차방정식 중근 조건 ((x-a)²(x²+bx+c) 형태)
      - 모든 실근이 자연수·정수일 조건
  - unit: CM1-EQ
    section: 여러 가지 부등식
    section_id: EQ-multi-ineq
    topics:
      - 이차부등식 (해의 영역·정수해)
      - 연립이차부등식
      - 절댓값 부등식 (단일·합·차)
      - 분수부등식 (단순)
      - 매개변수 이차부등식 (해 조건·정수해·실수해 존재)
      - 모든 실수에서 성립하는 부등식 (이차 판별식 ≤ 0 활용)
  - unit: CM1-CB
    section: 순열
    section_id: CB-perm
    topics: [nPr, 일렬 배열, 이웃·양 끝·자리 제약, 짝홀 자리 조건]
  - unit: CM1-CB
    section: 조합
    section_id: CB-comb
    topics: [nCr, 조합 합 공식, 짝홀 케이스 분류, 합·곱 조건]
  - unit: CM1-MX
    section: 행렬의 정의·연산
    section_id: MX-ops
    topics: [성분·같은 행렬, 덧셈·뺄셈·실수배, 곱셈·거듭제곱, 단위행렬·영행렬, AB≠BA 비가환성, 케일리해밀턴 폐쇄식 인용]

# ─────────────────────────────────────────────────────────────
# 시험범위 외 (목차 기반 — 단원 절 단위)
# ─────────────────────────────────────────────────────────────

excluded_sections:
  - unit: CM1-PL
    section: 다항식 (단원 전체)
    severity: RED
    reason: 단원 전체가 시험범위 외
    tool_usage_allowed:
      - 인수정리·조립제법은 여러 가지 방정식 풀이 도구로 등장 OK
      - 곱셈공식·인수분해는 매개변수 이차부등식 풀이 도구로 등장 OK

  - unit: CM1-EQ
    section: 복소수
    severity: RED
    reason: 마스터 명시 — 시험범위 외 (단, *주제로 다루는 슬롯만* 금지)
    blocked_topics:
      - 복소수의 정의와 사칙연산 *단독*
      - 켤레복소수 *단독* 슬롯 (z+z̄, z·z̄ 계산만이 주제)
      - 허수단위 거듭제곱 i^n *단독*
    tool_usage_allowed:
      - 복소수 *체계*는 사용 가능 (도구 활용 슬롯은 시험범위 안)
      - 사차·삼차방정식의 한 근이 a+bi → 켤레허근 활용 ✅
      - ω (1의 3제곱근, ω²+ω+1=0, ω³=1) 활용 → 삼·사차방정식 풀이 ✅
      - x³=1 또는 x³+1=0의 근으로서 ω 도입 → 거듭제곱 주기성 활용 ✅
      - **판정 기준**: 슬롯의 *주제*가 *고차방정식의 근/계수/조건*이면 시험범위 안.
        *복소수 자체의 계산·표현*이 주제면 시험범위 외.

  - unit: CM1-EQ
    section: 이차방정식
    severity: RED
    reason: 마스터 명시 — 시험범위 외
    blocked_topics:
      - 이차방정식의 근의 공식
      - 판별식 단독 주제
      - 이차방정식의 근과 계수의 관계 (두 근의 합·곱 단독)
    tool_usage_allowed:
      - 이차방정식 풀이는 여러 가지 방정식 풀이 단계에서 도구로 등장 OK
      - 판별식은 매개변수 이차부등식의 실근 조건 도구로 등장 OK

  - unit: CM1-EQ
    section: 이차방정식과 이차함수
    severity: RED
    reason: 시험범위 외 (교과서 §2-3)
    blocked_topics:
      - 이차함수 그래프 그리기·꼭짓점
      - 이차함수의 최댓값·최솟값
      - 두 곡선의 교점 (이차함수 vs 직선·이차함수 vs 이차함수)
    tool_usage_allowed:
      - 이차함수 표기 f(x) = ax² + bx + c가 *여러 가지 부등식*의 풀이 도구로 등장 OK
      - 예: 매개변수 이차부등식 슬롯에서 f(0)·f(5) ≤ 0 같은 *근의 위치 도구*는 풀이 보조로 허용
        (2026-06-25 마스터 확인: 이차함수가 *주제*가 아니라 *도구*면 통과)
      - 판정 기준: 슬롯의 *발문 주제*가 이차함수 그래프/최값이 아닌가? → 도구면 OK

# ─────────────────────────────────────────────────────────────
# 시험범위 외 *키워드* (스크립트 grep 차단)
# bank/출제메커니즘-v2.0.md §3.1 게이트 G4 적용
# ─────────────────────────────────────────────────────────────

forbidden_keywords:
  # 복소수 *단독 주제* 슬롯만 차단 — 도구 활용은 청사진 section과 대조하여 허용
  # 2026-06-25 마스터 정정: 복소수 도구 활용 (ω·켤레허근)은 시험범위 안

  - pattern: 'z\s*\+\s*\\\\bar\{z\}\s*[=의]|\\\\bar\{z\}\s*\+\s*z'
    name: 'z+z̄ 단독 계산 슬롯 (복소수 주제만 차단)'
    severity: YELLOW
    note: 슬롯의 *주제*가 복소수 계산이면 차단. 고차방정식의 도구로 등장하면 허용.

  - pattern: '복소수\s*z\s*=\s*[^,]+에\s*대하여.*\\\\bar\{z\}\s*[+\-=]'
    name: '복소수 z + 켤레복소수 단독 슬롯'
    severity: YELLOW
    note: 발문이 *복소수의 값* 자체를 묻는 형태만 차단. ω·켤레허근 활용은 OK.

  # i = √-1 표기는 *허용* (도구 활용 슬롯에서 정의 명시는 표준 발문)
  # 본 키워드는 더 이상 차단하지 않음 (2026-06-25 마스터 정정)

  # 이차방정식 단독 — 차단 (도구 사용은 YELLOW)
  - pattern: '이차방정식의?\s*근과\s*계수의?\s*관계|두\s*근의?\s*합.*곱|\\alpha\s*\+\s*\\beta.*\\alpha\\beta'
    name: '이차방정식 근과 계수의 관계 단독 주제 (시험범위 외)'
    severity: YELLOW
    note: 사차·삼차방정식 풀이 단계에서 부분 활용은 허용. 슬롯 청사진의 section이 EQ-multi-eq면 통과.

  # 이차함수 그래프·최값 — 직접 주제 차단
  - pattern: '이차함수의?\s*그래프|이차함수의?\s*최댓?값|이차함수의?\s*최솟?값|이차함수의?\s*꼭짓점'
    name: '이차함수 그래프·최값 (시험범위 외)'
    severity: RED

  # 가우스 기호 — CM1 교과과정 외 (시험범위 외와 별개로 CLAUDE.md 룰)
  - pattern: '\\\\lfloor|\\\\rfloor|⌊|⌋|가우스\s*기호|가우스\s*\['
    name: '가우스 기호 [x]·⌊x⌋ (CM1 교과과정 외 — 학평 별도 도구)'
    severity: RED
    note: cm1-curriculum-check.mjs와 중복 차단. 2026-06-25 마스터 확립.

  # 다항식 단원 단독 주제 — 차단
  - pattern: '항등식.*계수\s*결정|나머지정리(?!.*인수)|다항식의?\s*나눗셈\s*단독'
    name: '다항식 단원 단독 주제 (시험범위 외)'
    severity: YELLOW
    note: 사차방정식 풀이 도구로는 허용. 슬롯 청사진 section 대조.

# ─────────────────────────────────────────────────────────────
# 교과과정 외 (CM1 자체 외 — cm1-curriculum-check.mjs에 위임)
# ─────────────────────────────────────────────────────────────

curriculum_check: scripts/cm1-curriculum-check.mjs
curriculum_source: CLAUDE.md §"CM1 교과과정 단일출처 표" v1.2

# ─────────────────────────────────────────────────────────────
# 시험지 구성 정합 (라벨)
# ─────────────────────────────────────────────────────────────

format:
  total_problems: 23
  total_points: 100
  duration_min: 50
  # v2.0 (2026-06-25, 7회차부터) — 시리즈 5.5×4 논술 구조 폐지
  # 분배 X (4×14 + 4.5×2 + 5×7) 강제로 인한 자연스러운 재구성
  section_layout:
    - 객관식 14문 · 56점 (모두 4점 ★ 4)
    - 단답형 5문 · 24점 (4.5점 ★ 4 ×2 + 5점 ★ 5 ×3)
    - 논술형 4문 · 20점 (5점 ★ 5 ×4)

# ─────────────────────────────────────────────────────────────
# ★ 분포 제약 (2026-06-25 마스터 명시)
# ─────────────────────────────────────────────────────────────
# 마스터 발언: "출제시에 별 난이도 기준으로 3단계 이하 문제들은 출제하지마."
# → ★ 4·★ 5만 출제. ★ 1·★ 2·★ 3 전면 금지.
# 본 YAML이 단일 출처. star-consistency-check.mjs --min-star 4 강제.

star_constraints:
  min_star: 4
  max_star: 5
  forbidden_stars: [1, 2, 3]
  audience: 상위권
  reason: 마스터 명시 2026-06-25 — 동화고 시리즈는 심화·변별 위주 시험지

point_distribution_options:
  # 100점 정확 + ★ 4·5만 + 23문 — 가능한 자연스러운 분배
  - option: A
    label: ★ 5 비중 균형
    distribution: { 4.0: 14, 4.5: 4, 5.0: 3, 5.5: 2 }
    star4_count: 18
    star5_count: 5
    total_check: 14*4 + 4*4.5 + 3*5 + 2*5.5 = 56 + 18 + 15 + 11 = 100
  - option: B
    label: ★ 5 비중 강화
    distribution: { 4.0: 13, 4.5: 4, 5.0: 4, 5.5: 2 }
    star4_count: 17
    star5_count: 6
    total_check: 13*4 + 4*4.5 + 4*5 + 2*5.5 = 52 + 18 + 20 + 11 = 101  # 오류 — 사용 금지
  - option: C
    label: 논술 5.5점 풍부
    distribution: { 4.0: 14, 4.5: 3, 5.0: 2, 5.5: 4 }
    star4_count: 17
    star5_count: 6
    total_check: 14*4 + 3*4.5 + 2*5 + 4*5.5 = 56 + 13.5 + 10 + 22 = 101.5  # 오류 — 사용 금지

# 검증된 분배 (점수 합 = 정확히 100):
point_distribution_validated:
  - id: dist-A
    distribution: { 4.0: 14, 4.5: 4, 5.0: 3, 5.5: 2 }
    sum: 100
    star4: 18 (78%)
    star5: 5 (22%)
  - id: dist-B
    distribution: { 4.0: 15, 4.5: 2, 5.0: 4, 5.5: 2 }
    sum: 100
    star4: 17 (74%)
    star5: 6 (26%)
  - id: dist-C
    distribution: { 4.0: 16, 4.5: 1, 5.0: 3, 5.5: 3 }
    sum: 100
    star4: 17 (74%)
    star5: 6 (26%)
  - id: dist-D
    distribution: { 4.0: 13, 4.5: 6, 5.0: 2, 5.5: 2 }
    sum: 100
    star4: 19 (83%)
    star5: 4 (17%)
  - id: dist-E
    distribution: { 4.0: 12, 4.5: 4, 5.0: 5, 5.5: 2 }
    sum: 100
    star4: 16 (70%)
    star5: 7 (30%)

