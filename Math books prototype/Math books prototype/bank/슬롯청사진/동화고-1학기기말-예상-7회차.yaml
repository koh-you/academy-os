forbidden_in_blueprint:
  - 켤레복소수 / \bar{z} / z + \bar{z}
  - i = \sqrt{-1}  # (단 사차방정식 켤레허근 단순 인용은 OK — 본 7회차에선 미사용)
  - 이차방정식의 근과 계수의 관계 (단독 주제)
  - 두 근의 합·곱 (단독 주제) — \alpha+\beta + \alpha\beta
  - 이차함수의 그래프·최댓값·최솟값·꼭짓점
  - \lfloor / \rfloor / ⌊ / ⌋ / 가우스 기호
  - 산술평균·기하평균
  - 등차수열·등비수열·수열·\sum
  - sin/cos/tan/log/ln
  - 도함수·미분·적분·극값
  - 벡터 / \vec / \overrightarrow

