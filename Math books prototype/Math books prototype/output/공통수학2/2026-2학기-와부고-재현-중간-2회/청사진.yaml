# ────────────────────────────────────────────────────────────────────────
# 페르소나 — 갈아 끼우지 않는다. 다만 고칠 줄이 하나 있다
# ────────────────────────────────────────────────────────────────────────
persona_handling:
  decision: "페르소나 v1.1 을 그대로 쓴다"
  why: |
    페르소나는 2022·2023 원본 6종으로 크로스이어 검증했고 반박된 시그니처가 0 이다
    (와부고-출제-페르소나-v1.md:136-159). 다른 회차로 다시 뽑아도 거의 같은 것이 나온다.
    페르소나를 바꾸면 닮음은 안 줄고 「와부고다움」만 흔들린다.
    닮음의 근원은 페르소나가 아니라 「원본을 한 회차에서만 뽑은 것」이었다.

  # 🔴 세션 114 에 열두 회차를 전량 정독해 얻은 정정 (마스터 보고 완료)
  correction_S9:
    what: "S9 실세계 지문은 「핵심 DNA」가 아니다"
    evidence: |
      페르소나:157 은 S9 을 2022·2023·2025 전부 ● (강한 반복) 로 적었다.
      우리 범위(도형 + 집합·명제) 회차 아홉을 세면 다르다 —
        지문 2문: 2022 1기말 · 2025 2중간          (둘)
        지문 1문: 2021 1중간 · 2022 2중간 · 2023 1기말  (셋)
        지문 0문: 2023 2중간 · 2024 1기말 · 2024 2중간 · 2025 2기말  (넷)
      2024 는 세 회차 모두 0문이고, 2024 1학기 기말은 도형 13문을 순수 수학만으로 정점까지 끌고 간다.
      지문이 넷씩 나오는 회차(2022·2023·2024 2학기 기말)는 전부 경우의 수 단원 — 우리 범위 밖이다.
    so_what: "지문형은 필수 무기가 아니라 자주 꺼내는 무기다. 이 회차는 1문으로 간다"
    to_register: "🔴 세션 마무리 게이트에서 페르소나:157 과 §3 매트릭스를 고쳐 올린다"

range:
  units: [CM2-GM, CM2-ST]
  sub_units_included:
    CM2-GM:
      - G01 평면좌표 (거리·내분점·무게중심)
      - G02 직선의 방정식 (기울기·수직·평행·교점)
      - G03 원의 방정식 (표준형·접선·두 원의 위치 관계)
      - G04 도형의 이동 (평행이동·대칭이동)
    CM2-ST:
      - S01 집합의 뜻과 표현 (원소·부분집합)
      - S02 집합의 연산 (합·교·차·여집합·드모르간)
      - S03 명제 (조건·진리집합·충분·필요조건)
      - S04 명제의 증명 (대우·귀류법)
      - S05 절대부등식 (산술·기하평균)
  # 🔴 실기출 2025 2학기 중간에는 명제가 0문이다. 그래도 결함이 아니다 —
  #   시험범위는 유동적이고 (feedback_scope_differs_from_source_round),
  #   0문으로 똑같이 맞추는 것이 오히려 복제 신호다.

structure:
  total_slots: 17
  total_points: 100
  # 🔴 2022 개정 회차 둘(2025 2중간·2025 2기말)이 이 꼴이다.
  #   구 교육과정은 19문(15+4)·선택 70 : 서술 30 이었고, 개정 뒤 17문(12+5)·선택 60 : 서술 40 으로 바뀌었다.
  #   서술형 비중이 커졌다. 우리 회차는 개정 쪽을 따른다.
  layout:
    - {section: 선택형, slots: 12, slot_range: [1, 12], points_total: 60.0}
    - {section: 서술형, slots: 5,  slot_range: [13, 17], points_total: 40.0}
  points_scheme:
    선택형: [4.5, 4.6, 4.7, 4.8, 4.9, 5.0, 5.0, 5.1, 5.2, 5.3, 5.4, 5.5]   # 계 60.0
    서술형: [6.0, 8.0, 8.0, 8.0, 10.0]                                      # 계 40.0
  peaks:                              # 이중 봉우리 (페르소나 §2)
    선택형_국소정점: [10, 11, 12]
    서술형_최고봉: [15, 16, 17]
  unit_alternation: true              # 도형 ↔ 집합 ↔ 명제 교차

# 단원 비 — 1회와 갈린다
unit_mix:
  # 🔴 원본 pick 이 끝난 뒤 실측으로 고친 값이다 (세션 114). 종전 기재는 도형 11 · 명제 2 였다.
  #   10번(산술·기하평균)이 절대부등식이라 집합과 명제 단원으로 간다 — 도형이 아니다.
  도형의_방정식: 10                    # 1·3·5·7·9·11·12·13·16·17
  집합: 3                              # 2·4·6
  명제: 3                              # 8·10·14
  두_단원_융합: 1                      # 15번 · 🔒 마스터 확정 (세션 114)
  note: |
    1회는 도형 12 : 집합 3 : 명제 2 였고 융합 슬롯이 비어 있었다.
    실기출 2025 2중간은 도형 11 : 집합 6 이다.
    이 회차는 융합 한 자리를 서술형에 두어 도형과 집합·명제를 클라이맥스에서 묶는다 (S8).

# ────────────────────────────────────────────────────────────────────────
# 시그니처 커버리지 (페르소나 S1~S13 · 루브릭 D2)
# ────────────────────────────────────────────────────────────────────────
signature_coverage:
  핵심DNA:
    S1_정수개수: [6, 12]
    # 🔒 마스터 확정 (세션 114): 「정수 개수 세기는 꼭 넣을 필요는 없다. 있어도 그만 없어도 그만이다」
    #   → 자연스럽게 들어가는 자리에만 둔다. 채우려고 억지로 만들지 않는다.
    #   🔴 제작 워크플로우:248-251 의 「다음 회차에서 채운다」를 마무리 게이트에서 고쳐 올린다.
    S4_극값개수한답: [9, 16]
    S7_개수논리조건: [2]
    S8_두단원융합: [15]                # 🟢 1회에 비어 있던 자리를 채운다
    S9_실세계지문: [17]                # 🔴 1문 (1회는 2문) · 🔒 마스터 확정
  집합핵심:
    S6_집합함정괴물식: [4]
  도형고유:
    S2_불변량자취: [11]                # 🔴 1회는 다섯 문항이었다 (6·10·12·15·16) — 하나로 줄인다
    S3_반사최단대칭: [3, 11]
    S5_넓이원리유도: [13]
  추가:
    S10_명제다각도: [8]                # 🔴 14번을 뺐다 — 증명형 출제 금지 (마스터 2026-08-05)
                                      #    단일 출처: bank/마스터-지적/2026-08-05-증명형-출제-금지.md
                                      # 🔴 「1회에 없던 것을 넣는다」는 목적은 다른 셋이 채운다 —
                                      #    두 단원 융합(15) · 절대부등식의 울타리(10) ·
                                      #    「모든」과 「어떤」이 반대 방향으로 작동하는 자리(8)
    S11_보기진위킬러: [7, 11]
    S13_산술기하: [10]

descriptive_philosophy:
  과정강제: [13, 14, 15, 16, 17]       # 전 서술형 「과정을 논술하시오」
  원리유도: true                        # 신발끈·케일리해밀턴 메인 금지
  소문항계단식: [15, 16, 17]
  # 🔴 C32 다섯 기준을 소문항마다 건다. 넷째가 가장 자주 깨진다 —
  #   「학생이 스스로 만들어야 하는 것이 무엇인가」를 한 줄로 못 적으면 그 소문항은 미달이다.

narrative_slots:
  design_protocol: |
    수학-우선 (feedback_narrative_math_first_then_skin):
    ① 소재 없이 순수 수학 킬러를 완성하고 독립 검증(유일해) → ② 그 구조에 자연 대응하는 소재를 입힌다
    → ③ 소재가 수학을 낮추라고 하면 소재를 버리고 수학을 지킨다.
  slots:
  - slot: 17
    math_core_first: true
    math_core: "🔴 미정 — problem-author 가 순수 수학부터 확정한다. 후보 원본은 source_strategy 참조"
    theme: "🔴 미정 — 수학이 확정된 뒤에 입힌다"
    forbidden_themes:
      - "거리의 비가 일정한 점의 자취 — 1회 16번(두 등대 밝기)과 같은 수학이다"
      - "이차함수·원·직선의 교점 개수 — 1회 17번(호수공원)과 같은 수학이다"
    answer_style: |
      🔴 근호 답을 「정리하면 깔끔해진다」며 정수로 만들지 마라. 의도된 설계다
      (페르소나 §6-5 · 세션 104 마스터 재확정). 단 이중근호는 금지 — 단일 근호까지다.
    N_target: 1

