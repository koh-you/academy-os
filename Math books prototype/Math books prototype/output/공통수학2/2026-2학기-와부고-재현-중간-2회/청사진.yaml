# 세션 114 · 2026-08-04 · 세션 115 (2026-08-05) 에 완성
#
# 🔴🔴 이 파일의 슬롯 번호는 **설계 당시 번호**다. 완성본과 다르다.
#    세션 115 마지막에 선택형 열둘을 맹검 실측값 순으로 다시 늘어놓았다.
#    🔴 **완성본의 단일 출처는 `제안서/전체-도구-대조표.md`** 다 — 「옛 → 새」 대응이 거기 있다.
#    측정 근거: bank/measurements/회차대조-집계-v17.md
#
# 단일 출처: bank/와부고-출제-페르소나-v1.md v1.1 (S1~S13)
#            bank/와부고-시험지-제작-워크플로우-v1.md (일곱 걸음)
# 🔴 와부고 전용 · 통합 시스템 편입 금지 (feedback_wabu_persona_school_exclusive)
#
# 🔴🔴 1회와 무엇이 다른가 — 이것이 이 회차의 존재 이유다
#   1회는 실기출 2025 2학기 중간 한 회차를 문항별로 옆에 끼고 만들었다.
#   그래서 17문 중 15문이 실기출과 1대1 대응이었고 2문은 발문 문장이 같았다
#   (feedback_fidelity_rubric_rewards_copying). 세션 111·112 가 2·16·17번을 갈아 끼운 것도
#   전부 그 복제를 푸는 일이었다.
#   🔴 2회는 원본을 다른 회차들에서 뽑는다. 페르소나는 그대로 둔다 — 아래 §페르소나 참조.

