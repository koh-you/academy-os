    batjeom: 5
    target_star: 4
    unit: CM2-GM-02
    slot_type: 응용
    mechanism: {primary: 두 직선의 수직 조건 · 계수 결정, insight_type: 조건통합형, depth: 2}
    problem_type: 수직·평행 결합 조건 · 두 상수 결정
    source_status: picked
    source: {source_id: 고쟁이-CM2-CH02-STEP1-#064, tier: 고쟁이-STEP1, variation_type: number_only, copyright_similarity_target: [0.30, 0.85]}
    variation_status: number_only
    variation_notes: |
      원본: 직선 y=ax+2가 bx-3y-3=0과 수직·(b-2)x+y-4=0과 평행 · a²+b² (고쟁이 CH02 STEP1 #064 · 빈출).
      A형 변형: 직선 y=ax+3이 직선 bx-2y-1=0과 수직이고, 직선 (b-1)x+y-3=0과 평행할 때 a²+b². (계수 교체)
    답: "a²+b²=13"   # 자체 검증: 평행 (b-1)x+y-3=0 → y=-(b-1)x+3, 기울기 -(b-1) · a=-(b-1) → a=1-b · 수직 y=ax+3 ⊥ bx-2y-1=0(y=(b/2)x-1/2) → a·(b/2)=-1 → ab=-2 · 연립 (1-b)b=-2 → b²-b-2=0 → b=2 or -1. b=2: a=-1 · b=-1: a=2. 둘 다 a²+b²=1+4=5? 재계산: 1+4=5. 답=5 (정정)
    답_수정: "a²+b²=5"   # 정정 완료
    problem_summary: |
      직선 y=ax+3이 직선 bx-2y-1=0과 서로 수직이고, 직선 (b-1)x+y-3=0과 서로 평행할 때, a²+b²의 값.
    reuse_note: 정리편 02 미사용 원본 (고쟁이 STEP1 #064 빈출 · 상한 pool).
    signature: {primary_axis: 두 직선 위치 관계, source_domain: 고쟁이 STEP1 상한 pool}

