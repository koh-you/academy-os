  - slot_id: Q01
    문항번호: 1
    batjeom: 4
    target_star: 3
    unit: CM2-GM-01
    slot_type: 기본
    mechanism: {primary: 두 점 사이의 거리, insight_type: 절차형, depth: 1}
    problem_type: 두 점 사이의 거리 · 미지수 결정
    source_status: picked
    source: {source_id: RPM-CM2-GM-#0018, tier: RPM-유형, variation_type: number_only, copyright_similarity_target: [0.30, 0.85]}
    variation_status: number_only
    variation_notes: |
      원본: 두 점 A(4,a), B(a,4)에서 AB=5√2일 때 양수 a (RPM 유형 01 대표).
      A형 변형: A(3,a), B(a,3)에서 AB=4√2일 때 양수 a. (숫자만 교체 · 구조 100% 보존)
    답: "a=7"   # 자체 검증: (3-a)²+(a-3)²=32 → 2(a-3)²=32 → (a-3)²=16 → a-3=±4 → a=7 (양수)
    problem_summary: |
      두 점 A(3,a), B(a,3)에 대하여 AB=4√2일 때, 양수 a의 값.
    reuse_note: |
      정리편 01 CHK2에서 원본 (A(4,a),B(a,4)·AB=7√2 변형)이 사용됨.
      형성평가 A형은 원본 계수 회귀 + 다른 상수로 재변형 → 자기복제 회피.
    signature: {primary_axis: 평면좌표, source_domain: 정리편 원본 계열}

