    problem_type: 중점 좌표 역산 · 미지수 결정
    source_status: picked
    source: {source_id: RPM-CM2-GM-#0013, tier: RPM-교과서, variation_type: number_only, copyright_similarity_target: [0.30, 0.85]}
    variation_status: number_only
    variation_notes: |
      원본: A(a,4), B(-2,b) 중점 (2,1) → ab (RPM 교과서 문제).
      A형 변형: A(a,3), B(-4,b) 중점 (1,2) → a+b. (숫자·응답 변형)
    답: "a+b=7"   # 자체 검증: (a-4)/2=1 → a=6, (3+b)/2=2 → b=1, a+b=7
    problem_summary: |
      두 점 A(a,3), B(-4,b)의 중점이 (1,2)일 때, a+b의 값.
    reuse_note: 정리편 01 미사용 원본 (교과서 문제 pool).
    signature: {primary_axis: 내분·외분, source_domain: 정리편 원본 계열}

  - slot_id: Q03
    문항번호: 3
    batjeom: 4
    target_star: 3
    unit: CM2-GM-02
    slot_type: 기본
    mechanism: {primary: 두 점을 지나는 직선의 방정식, insight_type: 절차형, depth: 1}
    problem_type: 두 점을 지나는 직선의 방정식·기울기·y절편
    source_status: picked
    source: {source_id: 개념원리-CM2-GM-직선-예제-01, tier: 개념원리-예제, variation_type: number_only, copyright_similarity_target: [0.30, 0.85]}
    variation_status: number_only
    variation_notes: |
      원본: 두 점 (1,4), (3,-2)를 지나는 직선의 방정식 (개념원리 대표예제).
      A형 변형: 두 점 (-2,5), (3,-5)를 지나는 직선의 y절편. (숫자·응답만 변형)
    답: "y절편=-1"   # 자체 검증: 기울기=(-5-5)/(3-(-2))=-2, y-5=-2(x-(-2)) → y=-2x+1 · y절편 1 · 재검산: y=-2(-2)+b=5 → b=1 → 확인 y=-2·3+1=-5 ✓
    problem_summary: |
      두 점 A(-2,5), B(3,-5)를 지나는 직선의 y절편.
    reuse_note: |
      정리편 02 E1a는 개념원리-CM2-GM-직선-예제-02 (내분점 관련) 활용. 예제-01 미사용.
    답_수정: "y절편=1"   # 최종: y=-2x+1 · y절편 1
