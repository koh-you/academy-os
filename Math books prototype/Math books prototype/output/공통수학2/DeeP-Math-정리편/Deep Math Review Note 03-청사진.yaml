    answer: "OP=√34"   # AB=3√5, BC=5√5, AC=4√5 · 3:4:5 직각 (∠A=90°) · 내접원 r=√5 · P=(5,-3) · OP=√34 (2019.9월 고1 21번 · 학평 원문)
    peak_qualification: {C_gm03_pure_scope: true, C_incenter_geometry: true, C_right_triangle_recognition: true, C_algebraic_depth: true}

