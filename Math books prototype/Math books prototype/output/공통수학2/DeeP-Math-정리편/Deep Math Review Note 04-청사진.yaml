    problem_summary: |
      직선 y = 3x + 2를 x축의 방향으로 a만큼 평행이동한 후 원점에 대하여
      대칭이동한 직선이 점 (2, 1)을 지날 때, 상수 a의 값.
    answer: "a=-1"   # 평행이동 y=3(x-a)+2 · 원점 대칭 -y=3(-x-a)+2 → y=3x+3a-2 · (2,1): 1=6+3a-2 → a=-1 (예제-06 원문)
    variation_status: verbatim_original_kept
    page_placement: {page_num: 6, layout: dmex_dmproblem_dmsolution}
    signature: {defBox: false, primary_axis: 대칭·평행 순차}

  - slot_id: E5
    slot_type: 대표예제
    parent_concept: C3
    target_star: 4
    composite_range: [20, 26]
    source: {source_id: 개념원리-CM2-GM-이동-예제-07, tier: star_4, variation_type: number_only, copyright_similarity_target: [0.30, 0.85]}
    mechanism: {primary: 한 점을 축 대칭 → 두 점 사이 직선거리 = 두 선분 합의 최솟값, insight_type: 통찰형, depth: 2}
