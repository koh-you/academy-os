      선분 AP와 선분 BP의 길이의 합의 최솟값.
    answer: "AP+BP = √61"   # B의 x축 대칭 B'(6,-3) · AB' = √(36+25) = √61 (예제-07 원문)
    variation_status: verbatim_original_kept
    page_placement: {page_num: 8, layout: dmex_dmproblem_dmsolution}
    signature: {defBox: false, primary_axis: 대칭 최단거리}

  - slot_id: E6
    slot_type: 대표예제
    parent_concept: C3
    target_star: 4
    composite_range: [20, 26]
    source: {source_id: 개념원리-CM2-GM-이동-예제-09, tier: star_4, variation_type: number_only, copyright_similarity_target: [0.30, 0.85]}
    mechanism: {primary: 점을 직선에 대칭 · 중점 조건 + 수직 조건 연립, insight_type: 조건통합형, depth: 2}
