    problem_summary: |
      두 점 (-3, 4)를 (-1, 1)로 옮기는 평행이동에 의해
      직선 3x - y + 2 = 0이 직선 ax - y + b = 0으로 옮겨질 때 a+b.
    answer: "a+b=-4"   # 이동 (2, -3) · 3(x-2)-(y+3)+2=0 → 3x-y-7=0 · a=3, b=-7 (예제-02 원문)
    variation_status: verbatim_original_kept
    page_placement: {page_num: 2, layout: dmex_dmproblem_dmsolution}
    signature: {defBox: false, primary_axis: 평행이동, layout_hint: dmex+problem+approach+solution}

