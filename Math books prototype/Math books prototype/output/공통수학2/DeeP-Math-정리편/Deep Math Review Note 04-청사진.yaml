    parent_concept: C1
    target_star: 4
    composite_range: [20, 26]
    source: {source_id: 개념원리-CM2-GM-이동-예제-03, tier: star_3, variation_type: number_only, copyright_similarity_target: [0.30, 0.85]}
    mechanism: {primary: 원의 평행이동 중심 이동 + 반지름 조건 · 표준형 변환, insight_type: 조건통합형, depth: 2}
    structure: {constraint_count: 2, unknowns_count: 2, subquestion_count: 0, figure_needed: false}
    problem_summary: |
      평행이동 (x, y) → (x + 3, y - 4)에 의해 원 x²+y²+4x-2y+a=0이
      원 (x-1)²+(y+b)²=3으로 옮겨질 때 상수 a, b의 값.
    answer: "a=2, b=3"   # 원 표준형 (x+2)²+(y-1)²=5-a · 중심 (-2,1) → (1,-3) · b=3 · r²=5-a=3 → a=2 (예제-03 (2) 원문)
    variation_status: verbatim_original_kept
    page_placement: {page_num: 3, layout: dmex_dmproblem_dmsolution}
    signature: {defBox: false, primary_axis: 평행이동}

  - slot_id: E3
    slot_type: 대표예제
    parent_concept: C2
    target_star: 3
    composite_range: [13, 19]
    source: {source_id: 개념원리-CM2-GM-이동-예제-04, tier: star_3, variation_type: number_only, copyright_similarity_target: [0.30, 0.85]}
    mechanism: {primary: x축·y축 대칭 좌표 · 두 점 지나는 직선의 방정식, insight_type: 절차형, depth: 1}
    structure: {constraint_count: 2, unknowns_count: 0, subquestion_count: 0, figure_needed: false}
    problem_summary: |
      점 (4, 6)을 x축에 대하여 대칭이동한 점을 P, y축에 대하여
      대칭이동한 점을 Q라 할 때, 두 점 P, Q를 지나는 직선의 방정식.
    answer: "y = -3x/2"   # P(4,-6), Q(-4,6) · 기울기 -3/2 · y+6 = -3/2(x-4) → y=-3x/2 (예제-04 원문)
    variation_status: verbatim_original_kept
    page_placement: {page_num: 5, layout: dmex_dmproblem_dmsolution}
    signature: {defBox: false, primary_axis: 축 대칭}

  - slot_id: E4
    slot_type: 대표예제
    parent_concept: C2
    target_star: 4
    composite_range: [20, 26]
    source: {source_id: 개념원리-CM2-GM-이동-예제-06, tier: star_4, variation_type: number_only, copyright_similarity_target: [0.30, 0.85]}
    mechanism: {primary: 직선 평행이동 후 원점 대칭 순차 적용 · 지나는 점 조건, insight_type: 조건통합형, depth: 2}
