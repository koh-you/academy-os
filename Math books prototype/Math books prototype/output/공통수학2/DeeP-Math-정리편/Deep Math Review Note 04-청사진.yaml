check_slots:
  # 페이지 2 (E1 뒤 · 이동 벡터 결정·직선 평행이동)
  - slot_id: CHK1
    slot_type: 확인
    parent_representative: E1
    target_star: 3
    source: {source_id: 개념원리-CM2-GM-이동-유제-234, tier: star_3, variation_type: number_only}
    variation_status: verbatim_original_kept
    problem_summary: |
      점 (2, -4)를 점 (1, -3)으로 옮기는 평행이동에 의해
      점 (-3, 6)이 옮겨지는 점의 좌표.
    answer: "(-4, 7)"   # 이동 (-1, 1) · (-3-1, 6+1) = (-4, 7) (유제-234 원문)
    page_placement: {page_num: 2, layout: dmchecktitle+dmcheck}

  - slot_id: CHK2
    slot_type: 확인
    parent_representative: E1
    target_star: 3
    source: {source_id: 고쟁이-CM2-CH04-STEP1-#204, tier: star_3, variation_type: number_only}
    variation_status: verbatim_original_kept
    problem_summary: |
      평행이동 (x, y) → (x - 1, y + 4)에 의해 직선 y = 2x - 1이 옮겨지는
      직선의 방정식이 y = ax + b일 때, ab의 값.
    answer: "ab=10"   # y=2x-1 · (x,y)→(x-1, y+4) 역대입 x→x+1, y→y-4 · y-4=2(x+1)-1 → y=2x+5 · a=2, b=5 · ab=10 (세션 57 3차 정정 · 이전 -14 오기재)
    page_placement: {page_num: 2, layout: dmchecktitle+dmcheck}

  # 페이지 3 (E2 뒤 · 원의 평행이동·조건 결합)
  - slot_id: CHK3
    slot_type: 확인
    parent_representative: E2
    target_star: 3
    source: {source_id: 개념원리-CM2-GM-이동-유제-240, tier: star_3, variation_type: number_only}
    variation_status: verbatim_original_kept
    problem_summary: |
      원 x²+y²+6x+2y+8=0을 x축의 방향으로 a만큼, y축의 방향으로 b만큼
      평행이동하니 원 x²+y²-4x-4y+6=0과 일치할 때 ab.
    answer: "ab=15"   # 중심 (-3,-1) → (2,2) · 이동 (5, 3) · a·b=15 (유제-240 원문)
    page_placement: {page_num: 3, layout: dmchecktitle+dmcheck}

  - slot_id: CHK4
    slot_type: 확인
    parent_representative: E2
    target_star: 4
    source: {source_id: 개념원리-CM2-GM-이동-연습-247, tier: star_4, variation_type: number_only}
    variation_status: verbatim_original_kept
    problem_summary: |
      직선 4x + 3y - 5 = 0을 y축의 방향으로 k만큼 평행이동한 직선이
      원 (x - 1)²+y²=4에 접할 때 양수 k.
    answer: "k=3"   # |4-5-3k|/5=2 → |1+3k|=10 · 양수 k=3 (연습-247 원문)
    page_placement: {page_num: 3, layout: dmchecktitle+dmcheck}

  # 페이지 5 (E3 뒤 · 축 대칭 좌표·직선)
  - slot_id: CHK5
    slot_type: 확인
    parent_representative: E3
    target_star: 3
    source: {source_id: 개념원리-CM2-GM-이동-유제-259, tier: star_3, variation_type: number_only}
    variation_status: verbatim_original_kept
    problem_summary: |
      점 (k, 3)을 y축에 대하여 대칭이동한 점을 P,
      직선 y=x에 대하여 대칭이동한 점을 Q라 할 때, PQ = 2√5인 양수 k.
    answer: "k=1"   # P(-k,3), Q(3,k) · PQ² = (3+k)²+(k-3)² = 2k²+18 = 20 → k=1 (유제-259 원문)
    page_placement: {page_num: 5, layout: dmchecktitle+dmcheck}

  - slot_id: CHK6
    slot_type: 확인
    parent_representative: E3
    target_star: 4
    source: {source_id: 개념원리-CM2-GM-이동-유제-260, tier: star_4, variation_type: number_only}
    variation_status: verbatim_original_kept
    problem_summary: |
      직선 y = -3x + 6을 y축에 대하여 대칭이동한 직선에 수직이고
      점 (-3, 4)를 지나는 직선의 방정식.
    answer: "y = -x/3 + 3"   # y축 대칭 y=3x+6 · 기울기 3 · 수직 -1/3 · y-4=-1/3(x+3) (유제-260 원문)
    page_placement: {page_num: 5, layout: dmchecktitle+dmcheck}

  # 페이지 6 (E4 뒤 · 대칭·평행 순차·조건 결합)
  - slot_id: CHK7
    slot_type: 확인
    parent_representative: E4
    target_star: 3
    source: {source_id: 개념원리-CM2-GM-이동-유제-261, tier: star_4, variation_type: number_only}
    variation_status: verbatim_original_kept
    problem_summary: |
      직선 2x - 3y + 1 = 0을 x축에 대하여 대칭이동한 직선이
      원 (x - 4)²+(y + k)²=3의 넓이를 이등분할 때 상수 k.
    answer: "k=3"   # x축 대칭 2x+3y+1=0 · 중심 (4, -k) 지남 8-3k+1=0 → k=3 (유제-261 원문)
    page_placement: {page_num: 6, layout: dmchecktitle+dmcheck}

  - slot_id: CHK8
    slot_type: 확인
    parent_representative: E4
    target_star: 4
    source: {source_id: 개념원리-CM2-GM-이동-유제-265, tier: star_4, variation_type: number_only}
    variation_status: verbatim_original_kept
    problem_summary: |
      원 x²+y²-4x=0을 y축에 대하여 대칭이동한 후 y축의 방향으로 1만큼
      평행이동한 원이 직선 y = mx - 2에 접할 때 상수 m.
    answer: "m=-5/12"   # 이동 후 (x+2)²+(y-1)²=4 · d=|-2m-1-2|/√(m²+1)=2 → (2m+3)²=4(m²+1) → 12m=-5 (유제-265 원문)
    page_placement: {page_num: 6, layout: dmchecktitle+dmcheck}

  # 페이지 8 (E5 뒤 · 대칭 최단거리)
  - slot_id: CHK9
    slot_type: 확인
    parent_representative: E5
    target_star: 4
    source: {source_id: 개념원리-CM2-GM-이동-유제-266, tier: star_4, variation_type: number_only}
    variation_status: verbatim_original_kept
    problem_summary: |
      두 점 A(2, 4), B(3, -5)와 y축 위의 점 P에 대하여
      선분 AP와 선분 BP의 길이의 합의 최솟값.
    answer: "AP+BP = √106"   # A의 y축 대칭 A'(-2,4) · A'B=√(25+81)=√106 (유제-266 원문)
    page_placement: {page_num: 8, layout: dmchecktitle+dmcheck}

  - slot_id: CHK10
