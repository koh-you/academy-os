check_slots:
  # 페이지 2 (E1 뒤 · 함수 정의·치역)
  - slot_id: CHK1
    slot_type: 확인
    parent_representative: E1
    target_star: 3
    source: {source_id: 개념원리-CM2-FN-함수-유제-483, tier: star_3, variation_type: number_only}
    variation_status: verbatim_original_kept
    problem_summary: |
      정의역이 X={-1, 0, 1}, 공역이 Y={-2, -1, 0, 1, 2, 3}인 함수
      f(x)=x²+x+1의 치역을 구하시오.
    answer: "치역 = {1, 3}"
    page_placement: {page_num: 2, layout: dmchecktitle+dmcheck}

  - slot_id: CHK2
    slot_type: 확인
    parent_representative: E1
    target_star: 3
    source: {source_id: 고쟁이-CM2-CH07-STEP1-#479, tier: star_3, variation_type: number_only}
    variation_status: verbatim_original_kept
    problem_summary: |
      집합 X={-1, 0, 1}에서 Y={0, 1, 2}로의 대응 중 함수가
      아닌 것을 고르시오.
      ① f(x)=|x|    ② f(x)=x+1    ③ f(x)=x²+1
      ④ f(x)=2x+1   ⑤ f(x)=x³+1
    answer: "④"
    page_placement: {page_num: 2, layout: dmchecktitle+dmcheck}

  # 페이지 3 (E2 뒤 · 여러 가지 함수 · 일대일대응)
  - slot_id: CHK3
    slot_type: 확인
    parent_representative: E2
    target_star: 4
    source: {source_id: 고쟁이-CM2-CH07-STEP1-#487, tier: star_4, variation_type: number_only}
    variation_status: verbatim_original_kept
    problem_summary: |
      실수 전체의 집합에서 정의된 함수 f(x)=(a-2)x+3a-1이
      일대일대응이 되도록 하는 상수 a의 값의 범위를 구하시오.
    answer: "a ≠ 2 (즉, a의 값이 2가 아닌 모든 실수)"
    page_placement: {page_num: 3, layout: dmchecktitle+dmcheck}

  - slot_id: CHK4
    slot_type: 확인
    parent_representative: E2
    target_star: 4
    source: {source_id: RPM-CM2-FN-함수-#0815, tier: star_2, variation_type: number_only}
    variation_status: verbatim_original_kept
    problem_summary: |
      실수 전체의 집합에서 정의된 세 함수 f, g, h가
      f는 항등함수, g는 상수함수이고 f(2)=g(2)이다.
      h(x)=x²-3x+5일 때, h(f(1))+h(g(3))의 값을 구하시오.
    answer: "6"
    page_placement: {page_num: 3, layout: dmchecktitle+dmcheck}

  # 페이지 5 (E3 뒤 · 합성함수 기본)
  - slot_id: CHK5
    slot_type: 확인
    parent_representative: E3
    target_star: 3
    source: {source_id: 개념원리-CM2-FN-합성-유제-525, tier: star_3, variation_type: number_only}
    variation_status: verbatim_original_kept
    problem_summary: |
      두 함수 f(x)=x²+1, g(x)=2x-3에 대하여 (g∘f)(2) + (f∘g)(1)의
      값을 구하시오.
    answer: "9"
    page_placement: {page_num: 5, layout: dmchecktitle+dmcheck}

  - slot_id: CHK6
    slot_type: 확인
    parent_representative: E3
    target_star: 3
    source: {source_id: 고쟁이-CM2-CH07-STEP1-#494, tier: star_3, variation_type: number_only}
    variation_status: verbatim_original_kept
    problem_summary: |
      두 함수 f(x)=x+2, g(x)=ax+b에 대하여 f∘g = g∘f가
      모든 실수 x에 대하여 성립할 때, 상수 a의 값을 구하시오. (단, b는 상수)
    answer: "a = 1"
    page_placement: {page_num: 5, layout: dmchecktitle+dmcheck}

  # 페이지 6 (E4 뒤 · 합성 응용·반복)
  - slot_id: CHK7
    slot_type: 확인
    parent_representative: E4
    target_star: 4
    source: {source_id: 개념원리-CM2-FN-합성-유제-534, tier: star_4, variation_type: number_only}
    variation_status: verbatim_original_kept
    problem_summary: |
      두 함수 f, g에 대하여 f(x)=3x+1, (f∘g)(x)=6x-5일 때, g(x)를
      구하시오.
    answer: "g(x) = 2x - 2"
    page_placement: {page_num: 6, layout: dmchecktitle+dmcheck}

  - slot_id: CHK8
    slot_type: 확인
    parent_representative: E4
    target_star: 4
    source: {source_id: 개념원리-CM2-FN-합성-유제-535, tier: star_3, variation_type: number_only}
    variation_status: verbatim_original_kept
    problem_summary: |
      함수 f(x)=x+2에 대하여 f¹=f, f^(n+1) = f∘f^n (n은 자연수)로
      정의할 때, f¹⁰(1)의 값을 구하시오.
    answer: "21"
    page_placement: {page_num: 6, layout: dmchecktitle+dmcheck}

  # 페이지 9 (E5 뒤 · 역함수 값·계수)
  - slot_id: CHK9
    slot_type: 확인
    parent_representative: E5
    target_star: 3
    source: {source_id: RPM-CM2-FN-역함수-#0786, tier: star_2, variation_type: number_only}
    variation_status: verbatim_original_kept
    problem_summary: |
      함수 f(x)=3x-5에 대하여 f⁻¹(4)의 값을 구하시오.
    answer: "3"
    page_placement: {page_num: 9, layout: dmchecktitle+dmcheck}

  - slot_id: CHK10
    slot_type: 확인
    parent_representative: E5
    target_star: 4
    source: {source_id: 고쟁이-CM2-CH07-STEP1-#499, tier: star_3·4, variation_type: number_only}
    variation_status: verbatim_original_kept
    problem_summary: |
      함수 f(x)=ax+b에 대하여 f(2)=5, f⁻¹(-1)=-1일 때,
      f(4)의 값을 구하시오. (단, a, b는 상수)
    answer: "9"    # 세션 55 종료 시 정정 (Phase 3 자체 검증: 2a+b=5, -a+b=-1 → a=2, b=1 → f(4)=9)
