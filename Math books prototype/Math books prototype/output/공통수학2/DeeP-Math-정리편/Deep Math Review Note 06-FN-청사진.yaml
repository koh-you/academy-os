# §1. 개념 슬롯 (3개 · 원본 pick 아님 · 2022 개정 표준 용어)
# ══════════════════════════════════════════════════════════════
concept_slots:
  - slot_id: C1
    slot_type: 개념
    sub_section: 함수의 뜻과 그래프 · 여러 가지 함수
    page_placement: {page_num: 1, layout: dmconcept_full}
    contents:
      - dmsub 1: 함수의 정의 (X→Y 대응 · 정의역·공역·치역 · f:X→Y · y=f(x) · 함숫값 · 치역⊂공역)
      - dmsub 2: 서로 같은 함수 (정의역·공역 같고 모든 x∈X에 대하여 f(x)=g(x))
      - dmsub 3: 함수의 그래프 (그래프={(x, f(x)) | x∈X} · 세로직선 시험)
      - dmsub 4: 여러 가지 함수 (일대일함수 · 일대일대응 · 항등함수 I(x)=x · 상수함수 f(x)=c)
    signature: {defBox: true, primary_axis: 함수 정의·유형·그래프}

  - slot_id: C2
    slot_type: 개념
    sub_section: 합성함수
    page_placement: {page_num: 4, layout: dmconcept_full}
    contents:
      - dmsub 1: 합성함수의 정의 (f:X→Y, g:Y→Z에 대하여 g∘f: X→Z · (g∘f)(x)=g(f(x)))
      - dmsub 2: 합성함수의 성질 (일반적으로 f∘g ≠ g∘f · 결합법칙 (f∘g)∘h = f∘(g∘h))
      - dmsub 3: 항등함수와의 합성 (f∘I = I∘f = f)
      - dmsub 4: 반복 합성 · 미지 성분 결정 (f∘g=h에서 f 또는 g 구하기 · 치환 활용)
    signature: {defBox: true, primary_axis: 합성 정의·결합·미지 성분}

  - slot_id: C3
    slot_type: 개념
    sub_section: 역함수
    page_placement: {page_num: 8, layout: dmconcept_full}
    contents:
      - dmsub 1: 역함수의 정의 (f:X→Y 일대일대응 ⇔ 역함수 f⁻¹:Y→X 존재 · f(x)=y ⇔ f⁻¹(y)=x)
      - dmsub 2: 역함수의 성질 (f∘f⁻¹ = I_Y · f⁻¹∘f = I_X · (f⁻¹)⁻¹=f · (g∘f)⁻¹ = f⁻¹∘g⁻¹)
      - dmsub 3: 역함수 구하기 (y=f(x) → x에 대하여 풀고 x·y 교환 → y=f⁻¹(x))
      - dmsub 4: 역함수의 그래프 (y=f(x)와 y=f⁻¹(x)는 y=x에 대칭 · y=f(x)와 y=x 교점은 y=f⁻¹(x)와 y=x 교점과 같음)
    signature: {defBox: true, primary_axis: 역함수 정의·성질·그래프 대칭}

