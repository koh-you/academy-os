concept_slots:
  - slot_id: C1
    slot_type: 개념
    sub_section: 직선의 방정식
    page_placement: {page_num: 1, layout: dmconcept_full}
    contents:
      - dmsub 1: 한 점과 기울기가 주어진 직선 (y-y1=m(x-x1))
      - dmsub 2: 두 점을 지나는 직선 (기울기 (y2-y1)/(x2-x1))
      - dmsub 3: x·y 절편이 주어진 직선 (절편형 x/a+y/b=1) · 좌표축에 평행한 직선
      - dmsub 4: 세 점이 한 직선 위에 있을 조건 (기울기 등식 or 공선 조건)
    signature: {defBox: true, primary_axis: 직선 방정식}

  - slot_id: C2
    slot_type: 개념
    sub_section: 두 직선의 위치 관계
    page_placement: {page_num: 4, layout: dmconcept_full}
    contents:
      - dmsub 1: 두 직선의 평행·수직·일치 조건 (기울기 · 일반형 aa'+bb'=0)
      - dmsub 2: 두 직선의 교점을 지나는 직선 (l1 + k·l2 = 0 꼴)
      - dmsub 3: 선분의 수직이등분선 (중점 통과 · 수직 기울기)
      - dmsub 4: 세 직선이 삼각형을 이루지 않을 조건 (두 직선 평행 or 세 직선 공점)
    signature: {defBox: true, primary_axis: 위치관계}

  - slot_id: C3
    slot_type: 개념
    sub_section: 정점을 지나는 직선 · 점과 직선 사이의 거리
    page_placement: {page_num: 7, layout: dmconcept_full}
    contents:
      - dmsub 1: 정점을 지나는 직선 (매개변수 k에 대한 항등식 · 두 방정식 연립)
      - dmsub 2: 점과 직선 사이의 거리 공식 (|ax1+by1+c|/√(a²+b²))
      - dmsub 3: 평행한 두 직선 사이의 거리
      - dmsub 4: 좌표를 이용한 삼각형의 넓이 ((1/2)·밑변·높이 · 특강 원점 삼각형 공식)
    signature: {defBox: true, primary_axis: 거리}

