check_slots:
  # 페이지 2 (E1a 뒤 · 직선 방정식 기본)
  - slot_id: CHK1
    slot_type: 확인
    parent_representative: E1a
    target_star: 3
    source: {source_id: RPM-CM2-GM-직선-#0106, tier: star_3, variation_type: number_only}
    variation_status: modified
    problem_summary: |
      직선 y=(m-2)x-n-1이 점 (2,-1)을 지나고 x축의 양의 방향과 이루는 각의 크기가 45°일 때 m+n.
    answer: "m+n=5"   # 최소 변형 · 원본 유지 (자체 검증 · m=3, n=2)
    page_placement: {page_num: 2, layout: dmchecktitle+dmcheck}

  - slot_id: CHK2
    slot_type: 확인
    parent_representative: E1a
    target_star: 3
    source: {source_id: 고쟁이-CM2-CH02-STEP1-#055, tier: star_3, variation_type: number_only}
    variation_status: modified
    problem_summary: |
      세 점 A(-1,3), B(5,0), C(-3,-2)에 대해 선분 AB를 2:1로 내분하는 점 P, BC 중점 Q.
      두 점 P, Q를 지나는 직선의 x절편.
    answer: "x절편=2"   # 세션 55 최종 · P(3,1) · Q(1,-1) · 직선 y=x-2 · x절편 2 (본편 대응)
    page_placement: {page_num: 2, layout: dmchecktitle+dmcheck}

  # 페이지 3 (E1b 뒤 · 넓이 이등분)
  - slot_id: CHK3
    slot_type: 확인
    parent_representative: E1b
    target_star: 3
    source: {source_id: RPM-CM2-GM-직선-#0115, tier: star_3, variation_type: number_only}
    variation_status: modified
    problem_summary: |
      A(3,3), B(5,-5), C(-1,1)이 꼭짓점 삼각형 ABC의 넓이를 점 A를 지나는 직선 y=ax+b가
      이등분할 때 a+b.
    answer: "a+b=-7"   # BC 중점 (2,-2) · A(3,3)와 (2,-2) 지나는 y=5x-12·a=5, b=-12·a+b=-7 (자체 검증)
    page_placement: {page_num: 3, layout: dmchecktitle+dmcheck}

  - slot_id: CHK4
    slot_type: 확인
    parent_representative: E1b
    target_star: 4
    source: {source_id: 개념원리-CM2-GM-직선-유제-69, tier: star_4, variation_type: number_only}
    variation_status: modified
    problem_summary: |
      점 (6,-4)를 지나는 직선의 x절편이 y절편의 2배일 때, 이 직선의 방정식. (단, y절편 ≠ 0)
    answer: "y=-x/2-1"   # x/(2b)+y/b=1 · (6,-4) 대입: 3/b - 4/b = 1 → -1/b=1 → b=-1 · x절편 -2 · 직선 x/(-2)+y/(-1)=1 → x+2y+2=0 → y=-x/2-1 (자체 검증)
    page_placement: {page_num: 3, layout: dmchecktitle+dmcheck}

  # 페이지 5 (E2a 뒤 · 수직·평행)
  - slot_id: CHK5
    slot_type: 확인
    parent_representative: E2a
    target_star: 3
    source: {source_id: 고쟁이-CM2-CH02-STEP1-#062, tier: star_3, variation_type: number_only}
    variation_status: modified
    problem_summary: |
      점 (2,1)을 지나고 직선 3x-y+2=0과 수직인 직선의 y절편.
    answer: "y절편=5/3"   # 수직 기울기 -1/3 · y-1=-(1/3)(x-2) → y=-x/3+5/3 · y절편 5/3 (자체 검증)
    page_placement: {page_num: 5, layout: dmchecktitle+dmcheck}

  - slot_id: CHK6
    slot_type: 확인
    parent_representative: E2a
    target_star: 3
    source: {source_id: 고쟁이-CM2-CH02-STEP1-#065, tier: star_3, variation_type: number_only}
    variation_status: modified
    problem_summary: |
      두 점 A(-1,1), B(3,3)에 대해 선분 AB의 수직이등분선의 방정식.
    answer: "y=-2x+4"   # 세션 55 최종 · 중점 (1,2) · AB 기울기 1/2 · 수직 기울기 -2 · y-2=-2(x-1) → y=-2x+4 (본편 대응)
    page_placement: {page_num: 5, layout: dmchecktitle+dmcheck}

  # 페이지 6 (E2b 뒤 · 세 직선)
  - slot_id: CHK7
    slot_type: 확인
    parent_representative: E2b
    target_star: 4
    source: {source_id: 개념원리-CM2-GM-직선-유제-108, tier: star_4, variation_type: number_only}
    variation_status: modified
    problem_summary: |
      세 직선 2x+y+1=0, x-y+2=0, ax-y=0이 삼각형을 이루지 않도록 하는 모든 상수 a의 값의 합.
    answer: "a합=-2"   # 세션 55 최종 · 두 평행 case: a=-2, a=1 · 공점 case (-1,1): a=-1 → 합 -2+1-1=-2 (본편 대응)
    page_placement: {page_num: 6, layout: dmchecktitle+dmcheck}

  - slot_id: CHK8
    slot_type: 확인
    parent_representative: E2b
    target_star: 4
    source: {source_id: RPM-CM2-GM-직선-#0142, tier: star_4, variation_type: number_only}
    variation_status: modified
    problem_summary: |
      세 직선 x+2y-6=0, 4x-3y-12=0, ax+y-1=0으로 둘러싸인 삼각형이 직각삼각형이 되도록
      하는 모든 상수 a의 값의 합.
    answer: "a합=-5/4"   # (i) 첫째⊥셋째: 1·a+2·1=0 → a=-2. (ii) 둘째⊥셋째: 4a-3=0 → a=3/4. 합 -2+3/4=-5/4 (자체 검증)
    page_placement: {page_num: 6, layout: dmchecktitle+dmcheck}

  # 페이지 8 (E3a 뒤 · 점-직선 거리)
  - slot_id: CHK9
    slot_type: 확인
    parent_representative: E3a
    target_star: 3
    source: {source_id: RPM-CM2-GM-직선-#0148, tier: star_3, variation_type: number_only}
    variation_status: modified
    problem_summary: |
      평행한 두 직선 x+2y+1=0, x+2y+k=0 사이의 거리가 4√5일 때, 모든 상수 k의 값의 합.
    answer: "k합=2"   # (-1,0)과 x+2y+k=0 거리 |-1+k|/√5=4√5 → |k-1|=20 → k=21, -19 · 합=2 (자체 검증)
    page_placement: {page_num: 8, layout: dmchecktitle+dmcheck}

  - slot_id: CHK10
    slot_type: 확인
    parent_representative: E3a
    target_star: 4
    source: {source_id: 개념원리-CM2-GM-직선-유제-127, tier: star_4, variation_type: number_only}
    variation_status: modified
    problem_summary: |
      직선 3x+4y+1=0에 수직이고 원점으로부터의 거리가 1인 직선의 방정식을 모두 구하기.
    answer: "4x-3y+5=0 또는 4x-3y-5=0"   # 수직 기울기 4/3 · 4x-3y+c=0 · |c|/5=1 → c=±5 (자체 검증)
    page_placement: {page_num: 8, layout: dmchecktitle+dmcheck}

  # 페이지 9 (E3b 뒤 · 삼각형 넓이)
  - slot_id: CHK11
    slot_type: 확인
