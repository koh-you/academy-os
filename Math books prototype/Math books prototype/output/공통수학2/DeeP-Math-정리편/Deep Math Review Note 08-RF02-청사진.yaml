      x=√3일 때, (√(x+1)-√(x-1))/(√(x+1)+√(x-1)) 값.
    answer: "√3 - √2"   # 분자·분모에 (√(x+1)-√(x-1)) 곱 → (x - √(x²-1)). x=√3 대입: √3 - √2
    variation_status: verbatim_original_kept
    page_placement: {page_num: 2, layout: dmex_dmproblem_dmsolution}
    signature: {defBox: false, primary_axis: 켤레 유리화·값 계산}

