    contents:
      - dmsub 1: 무리식의 뜻과 성질 (√(다항식) · 근호 안 ≥ 0 조건 · 분모 ≠ 0)
      - dmsub 2: 분모의 유리화 (켤레무리수 √a+√b · √a-√b · 곱하기 (a-b) 원리)
      - dmsub 3: 무리식의 사칙연산 (통분·유리화·근호 안 정리)
      - dmsub 4: 조건식과 무리식의 값 (x·y 대칭식 대입 · 유리화 후 대입)
