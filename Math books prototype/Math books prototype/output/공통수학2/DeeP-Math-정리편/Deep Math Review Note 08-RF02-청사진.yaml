    target_star: 4
    composite_range: [15, 21]
    source: {source_id: 개념원리-CM2-RF-무리식-유제-652, tier: star_4, variation_type: number_only, copyright_similarity_target: [0.30, 0.85]}
    mechanism: {primary: 무리식 유리화 · 텔레스코핑 소거, insight_type: 조건통합형, depth: 2}
    structure: {constraint_count: 1, unknowns_count: 0, subquestion_count: 0, figure_needed: false}
    problem_summary: |
      f(x)=1/(√x+√(x+1))일 때 f(1)+f(2)+f(3)+…+f(99) 값.
    answer: "9"   # f(x)=√(x+1)-√x. 합=√100-√1=10-1=9
    variation_status: verbatim_original_kept
    page_placement: {page_num: 3, layout: dmex_dmproblem_dmsolution}
    signature: {defBox: false, primary_axis: 무리식 텔레스코핑}

