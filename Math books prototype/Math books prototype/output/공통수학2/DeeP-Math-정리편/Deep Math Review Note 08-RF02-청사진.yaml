    answer: "④ (a<0, b>0, c>0 · y=√(a(x+b/a))+c 형태 · 시작점 (-b/a, c) 위치 (양, 양) · +√이므로 왼쪽 방향으로 y 증가)"
    # 원문 그림 재현 완료 — 원본 유리함수 개형 (점근선 x=-a>0, y=c>0, b>0으로 곡선은 우상 갈래+좌하 갈래 · 예 a=-2,b=2,c=1) TikZ로 재현
    # 5-보기 개형 재조판 : ① 오른쪽 위 · ② 오른쪽 아래 · ③ 왼쪽 아래 · ④ 왼쪽 위 (정답) · ⑤ 오른쪽 위 c<0
    peak_qualification: {C_rf02_pure_scope: true, C_rational_to_irrational_signs: true, C_graph_reading_multilayer: true}
    signature: {defBox: false, primary_axis: 그래프 부호 판독·개형 매칭, figure_needed: true}

