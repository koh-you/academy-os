      (1) y=√(2x+4)+1. (2) y=-√(2-x)-1.
    answer: "(1) 정의역 x≥-2, 치역 y≥1, 시작점 (-2, 1)   (2) 정의역 x≤2, 치역 y≤-1, 시작점 (2, -1)"
    variation_status: verbatim_original_kept
    page_placement: {page_num: 5, layout: dmex_dmproblem_dmsolution}
    signature: {defBox: false, primary_axis: 표준형·시작점}

  - slot_id: E4
    slot_type: 대표예제
    parent_concept: C2
    target_star: 4
    composite_range: [20, 26]
    source: {source_id: 개념원리-CM2-RF-무리함수-예제-05, tier: star_4, variation_type: number_only, copyright_similarity_target: [0.30, 0.85]}
    mechanism: {primary: 그래프 시작점 · 지나는 점 대입 → 계수 결정, insight_type: 조건통합형, depth: 2}
    structure: {constraint_count: 2, unknowns_count: 3, subquestion_count: 0, figure_needed: false}
    problem_summary: |
      무리함수 y=-√(ax+b)+c의 그래프는 다음을 만족한다: 시작점이 (-2, 1)이고 점 (0, -1)을 지난다.
      상수 a, b, c의 값을 각각 구하시오.
    answer: "a=2, b=4, c=1"   # y=-√(a(x+2))+1로 놓고 (0,-1) 대입 → √(2a)=2, a=2. b=-(-2)·a=4. c=1
    variation_status: verbatim_original_kept
    page_placement: {page_num: 6, layout: dmex_dmproblem_dmsolution}
    signature: {defBox: false, primary_axis: 시작점·지나는 점}

  - slot_id: E5
    slot_type: 대표예제
    parent_concept: C3
    target_star: 4
    composite_range: [20, 26]
    source: {source_id: 개념원리-CM2-RF-무리함수-예제-06, tier: star_5, variation_type: number_only, copyright_similarity_target: [0.30, 0.85]}
    mechanism: {primary: 무리함수·직선 위치 관계 · 접함 (판별식) + 시작점 지남 케이스, insight_type: 통찰형, depth: 3}
    structure: {constraint_count: 1, unknowns_count: 0, subquestion_count: 3, figure_needed: false}
    problem_summary: |
      무리함수 y=√(4-2x)의 그래프와 직선 y=-x+k의 위치 관계에 대하여 다음 각 경우가 되도록 하는 상수 k의 값 또는 범위를 구하시오.
      (1) 서로 다른 두 점에서 만난다.
      (2) 오직 한 점에서 만난다.
      (3) 만나지 않는다.
    answer: "(1) 2 ≤ k < 5/2   (2) k < 2 또는 k = 5/2   (3) k > 5/2"
    variation_status: verbatim_original_kept
    page_placement: {page_num: 8, layout: dmex_dmproblem_dmsolution}
    signature: {defBox: false, primary_axis: 접점·시작점·케이스}

  - slot_id: E6
    slot_type: 대표예제
    parent_concept: C3
    target_star: 4
    composite_range: [20, 26]
    source: {source_id: 개념원리-CM2-RF-무리함수-예제-07, tier: star_4, variation_type: number_only, copyright_similarity_target: [0.30, 0.85]}
    mechanism: {primary: 무리함수 역함수 유도 · 정의역·치역 교환, insight_type: 조건통합형, depth: 2}
    structure: {constraint_count: 1, unknowns_count: 0, subquestion_count: 0, figure_needed: false}
    problem_summary: |
      무리함수 f(x)=√(4x-2)+1의 역함수 f⁻¹(x)를 구하고 그 정의역과 치역을 각각 구하시오.
    answer: "f⁻¹(x) = (x-1)²/4 + 1/2 · 정의역 x≥1 · 치역 y≥1/2"
    variation_status: verbatim_original_kept
    page_placement: {page_num: 9, layout: dmex_dmproblem_dmsolution}
    signature: {defBox: false, primary_axis: 역함수·정의역·치역}

