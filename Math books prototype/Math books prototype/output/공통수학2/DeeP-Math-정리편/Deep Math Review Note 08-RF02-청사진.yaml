    sub_section: 무리함수의 활용 (역함수·직선과의 위치)
    page_placement: {page_num: 7, layout: dmconcept_full}
    contents:
      - dmsub 1: 무리함수의 역함수 (y=√(a(x-p))+q → y=(x-q)²/a+p · 이차함수 (제한된 정의역))
      - dmsub 2: 무리함수와 직선의 위치 관계 (제곱 후 판별식 D=0 접함 · 시작점 지남 · 케이스 분리)
      - dmsub 3: 이차함수 y=(x-h)²+k (x≥h)의 역함수 = 무리함수 (y=x 대칭)
      - dmsub 4: 폐구간 최대·최소 (표준형 → 감소/증가 판단 → 경계값 대입) · 무리함수와 역함수의 교점 (y=x 위)
    signature: {defBox: true, primary_axis: 역함수·직선 교점·경계값}

