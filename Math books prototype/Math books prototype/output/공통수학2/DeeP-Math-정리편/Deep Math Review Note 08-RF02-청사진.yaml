  - slot_id: C2
    slot_type: 개념
    sub_section: 무리함수와 그래프
    page_placement: {page_num: 4, layout: dmconcept_full}
    contents:
      - dmsub 1: 무리함수의 뜻과 정의역 (근호 안 ≥ 0 · y=√(다항식) 꼴)
      - dmsub 2: y=√x 그래프 (정의역 x≥0 · 치역 y≥0 · y=x² (x≥0)의 역함수 · y=x 대칭)
      - dmsub 3: y=√(ax) 그래프 (a>0·a<0 좌우 대칭 · y=-√x · y=√(-x) 반사)
      - dmsub 4: y=√(a(x-p))+q 표준형 (평행이동 (p,q) · 시작점 (p,q) · 방향 판정)
    signature: {defBox: true, primary_axis: 표준형·평행이동·시작점}

  - slot_id: C3
