    mechanism: {primary: y=k/x와 직선 y=-x+6의 y=x 대칭성 활용 · 삼각형 OPQ 넓이를 OAB에서 두 대칭 삼각형 뺀 값으로 · k 유일해, insight_type: 통찰형, depth: 3}
