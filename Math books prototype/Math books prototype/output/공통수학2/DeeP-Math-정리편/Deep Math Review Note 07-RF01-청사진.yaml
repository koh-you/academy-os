    verbatim_kichul: true
    mechanism: {primary: 유리함수 f(x)=4/(x-a)-4의 축교점·점근선 교점으로 사각형 OBCA 좌표 결정 · 넓이 방정식 → a 유일해, insight_type: 조건통합형, depth: 2}
    structure: {constraint_count: 1, unknowns_count: 1, subquestion_count: 0, figure_needed: true}   # 사각형 OBCA 꼭짓점 대응 도해 · 원문 그림 있음 유력 (Phase 2 PDF 재확인)
    problem_summary: |
      유리함수 f(x)=4/(x-a)-4 (a>1)에 대하여 좌표평면에서 함수 y=f(x)의
      그래프가 x축, y축과 만나는 점을 각각 A, B라 하고, 함수 y=f(x)의 그래프의
      두 점근선이 만나는 점을 C라 하자. 사각형 OBCA의 넓이가 24일 때 상수 a의 값.
      (단, O는 원점)
    answer: "a=5"   # A(a+1, 0), B(0, -4/a-4), C(a, -4) · 사각형 넓이 = 4a+4 = 24 · a=5 · 학평 2023.11 고1 16번 원문
    peak_qualification: {C_rf01_pure_scope: true, C_intercepts_asymptote_intersection: true, C_quadrilateral_area_equation: true, C_visualization_complex: true}

