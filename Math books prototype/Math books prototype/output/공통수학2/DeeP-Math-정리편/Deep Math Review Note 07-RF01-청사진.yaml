    target_star: 5
    target_star_premium: true
    source: {source_id: 전국연합-2024-3월-고2-17번, tier: star_5, variation_type: verbatim_kichul}
    verbatim_kichul: true
    mechanism: {primary: 반비례곡선 y=k/x 위 두 점 P, Q 기울기 조건 → k=a(a+2) 유도 · 원점대칭 두 점 R, S 사각형 넓이 조건, insight_type: 통찰형, depth: 3}
    structure: {constraint_count: 2, unknowns_count: 2, subquestion_count: 0, figure_needed: false}   # Phase 2 PDF 재확인: 조건 (가)·(나)만 텍스트 · 원문 그림 없음 유력
    problem_summary: |
      두 양수 a, k에 대하여 곡선 y=k/x 위의 두 점 P(a, f(a)), Q(a+2, f(a+2))가
      다음 조건을 만족시킬 때 k의 값. (단, f(x)=k/x)
      (가) 직선 PQ의 기울기는 -1이다.
      (나) 두 점 P, Q를 원점에 대하여 대칭이동한 점을 각각 R, S라 할 때
           사각형 PQRS의 넓이는 8√5이다.
    answer: "k=4"   # k=a(a+2), a=√5-1, k=(√5-1)(√5+1)=4 · 학평 2024.3 고2 17번 원문
