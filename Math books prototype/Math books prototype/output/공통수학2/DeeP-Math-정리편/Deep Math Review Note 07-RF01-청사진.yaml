    answer: "k=32/9"   # △OAB=18, △OAP+△OBQ=4, △OAP=2, b=2/3, a=16/3, k=ab=32/9 · 학평 2016.3 고2 18번 원문 · 그림 있음
    peak_qualification: {C_rf01_pure_scope: true, C_hyperbola_line_intersection: true, C_symmetry_area_reduction: true, C_visualization_complex: true}

