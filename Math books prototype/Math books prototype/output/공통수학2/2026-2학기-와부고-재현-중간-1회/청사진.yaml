  - {n: 5,  points: 4.9, unit: CM2-GM, subunit: [G03, G04], difficulty: 중,  signature: S3,        insight: [I-SYM, I-CON], choice_type: 일반, standard: 10수05-04, primary_tool: GM-05, cm2_scope: in, role: "rev18 재출제 (세션 109 후반 · 마스터 승인) — 종전 'f(y,x-2)=0 이 나타내는 이동으로 점 하나를 옮긴다 (② (9,4))' 는 치환 한 줄로 끝났고 값이 하나뿐이었다. 평행이동량을 문자 a 로 남기고 조건 상자 두 줄을 걸었다 (⑤ (11,4)). 두 값이 서로 다른 도구에서 나온다 — a=4 는 원과 직선의 접함(중심에서 직선까지의 거리 = 반지름)에서, 점 A(11,4) 는 그 a 를 넣어 점을 옮기는 데서 나온다. 앞은 도형(직선)을 옮겨 원과의 관계를 보고 뒤는 점을 옮긴다. (가) 만으로는 |a+1|=5 에서 a=4 와 a=-6 둘이 남고 (나)가 하나를 남긴다. 발문은 f(y,x-a)=0 이 어떤 이동인지 알려 주지 않는다 — (X,Y)↦(Y+a,X) 를 학생이 세운다. 답이 정수쌍이고 풀이에 나오는 근호는 √5 하나인데 |a+1|=5 로 바로 사라진다. 🔴 14번과 이동의 꼴이 같으나 14번은 원과 원이 한 점에서 만나는 조건에서 k 를 되짚는 서술형이고 이 슬롯은 원과 직선의 접함을 쓰는 선택형이다. S3 커버리지 유지 · G03(원과 직선의 위치 관계) 이 새로 들어온다"}
  - {n: 6,  points: 5.0, unit: CM2-ST, subunit: [S01, S02], difficulty: 상,  signature: S4,        insight: [I-CON, I-BW], choice_type: 일반, standard: 10수06-01, primary_tool: ST-03, cm2_scope: in, role: "rev18 재출제 (세션 109 후반 · 마스터 승인) — 종전 'n(A∪B)=17·n(A∩B)=3 에서 n(A) 의 최댓값 M 과 순서쌍의 개수 N (① 19)' 은 n(A)+n(B)=20 이 한 줄로 나오고 (나)를 걸면 세 쌍이 한꺼번에 적혀, M 은 그 목록의 맨 위를 읽는 일이고 N 은 줄 수를 세는 일이었다. 두 값이 같은 목록을 두 번 읽은 것이라 도구가 하나였다. 게다가 (가)와 (나)가 같은 층에 있었다 — 둘 다 원소가 몇 개인지만 말한다. 전체집합에 원소를 실제로 넣어 두 층을 따로 두었다 (④ 92 · M=10 · S=82). M 은 개수 층에서 나온다 — 20=3+3+n(A-B)+n(B-A) 로 14 를 얻고, (나)의 두 제약이 각각 짝수 전체 E 와 3 또는 5 의 배수 전체 T 를 가리키며 n(E∪T)=14 라 두 집합이 같아진다. S 는 원소 층에서 나온다 — 어느 원소가 어느 쪽에 강제로 들어가는지 알아낸 뒤 자유로운 다섯 중 큰 것 둘을 고른다. S 는 M 을 얻은 식에서 읽히지 않고, 거꾸로 M 은 원소가 무엇인지 몰라도 개수만으로 나온다. (나)의 「또는」이 지렛대다 — 「3 의 배수」만 두면 n(E∪T)=13<14 라 해가 없다. 발문이 n(A∪B)·여집합·n(A∩B) 표기를 쓰지 않고 말로만 적어 학생이 개수 방정식을 스스로 세운다. 결론이 개수 세기가 아니라 원소의 합이다. S4(극값·개수를 한 답으로) 커버리지 유지 — M+S 한 답 그대로다. 이전 rev11 사유 기록: 개수 방정식 + 배수(약수) 논증 → 최댓값 M과 순서쌍 개수 N을 한 답 M+N 으로 합성. 🔴 rev7 파라미터 (n(A∪B), n(A∩B))=(15,3) 은 정답이 발문에 적혀 있는 구조적 결함이었다: T=n(A)+n(B)=n(A∪B)+n(A∩B) 이고 (나)는 n(B)|T 와 동치이며 A∩B⊂B 에서 n(B)≥n(A∩B) 이므로, n(A∩B)|T 이면 n(B) 의 최솟값이 n(A∩B) 가 되어 M=T-n(A∩B)=n(A∪B) 가 항상 성립한다. 3|18 이라 M=15=n(A∪B)·N=3=n(A∩B)·M+N=18=15+3 — 주어진 두 수를 더한 한 줄로 정답에 도달했다. 해소 조건은 n(A∩B)∤T 이고, n(A∪B)=17 로 교체하면 T=20·3∤20 이라 n(B) 최솟값이 4 로 밀려 M=16≠17·M+N=19≠20. 해 (16,4)(15,5)(10,10) 3개로 rev7과 동일해 논증 부담·tier 불변. 선택지 5개 전부 실제 오류의 결과값으로 재설계(19 정답·20 발문수치 직독·22 하한 누락 부분·24 하한 누락 전면·26 최대최소 M+m 반사). 종전 포함배제 최대·최소(M+m)는 예상 3회 Q6·6회 Q6 와 자기복제로 폐기"}
  - {n: 7,  points: 5.0, unit: CM2-GM, subunit: G03, difficulty: 상,  signature: "-",        insight: [I-CON, I-BW], choice_type: 일반, standard: 10수05-03, primary_tool: GM-04, cm2_scope: in, role: "rev18 재출제 (세션 109 후반 · 마스터 승인) — 미지수를 k 하나에서 k·r 둘로 늘리고 조건 상자 두 줄을 걸었다 (③ 6). 종전은 미지수가 k 하나여서 공통현의 식을 세우고 중심을 넣는 한 줄로 끝났다. 두 값이 서로 다른 원에서 서로 다른 관계식으로 나온다 — r=2 는 「넓이를 이등분한다 → 중심을 지난다 → AB 가 원 C2 의 지름」이라는 번역과 (나)에서, k=4 는 원 C1 쪽에서 현의 길이와 중심까지의 거리를 잇는 피타고라스에서 나온다. 순서를 바꿀 수 없다 — r 를 먼저 얻어야 C1 쪽 식을 세운다. 구한 값이 두 원이 서로 다른 두 점에서 만나는 범위(4<4√2<8)에 드는지 되돌아가 확인해야 논증이 끝난다. 답이 정수이고 개수 세기가 없다. 🔴 시그니처 S1(정수 개수 세기)은 이 슬롯에 없다 — 마스터 확정 (세션 109): 2번이 혼자 맡는다. 이전 rev15 사유 기록: 맹검 판정 3.40 으로 목표 미달이어서 교체. 종전 '두 원의 공통현 존재조건 → 정수 k 의 개수 (③ 6)' 는 표준 절차 한두 마디로 끝났고 개수 세기로 노동만 늘렸다. 두 원의 중심을 (0,0) 과 (k,k) 로 두어 매개변수가 중심의 두 좌표에 함께 들어가게 하고, 공통현이 C2 의 넓이를 이등분한다는 조건에서 k 를 되짚는다 (③ 2). 통찰은 넓이 이등분을 중심 통과로 옮기는 것이고, 구한 k 가 두 원이 두 점에서 만나는 범위 안에 드는지 되돌아가 확인해야 논증이 끝난다. 🔴 시그니처 S1(정수 개수 세기)이 이 슬롯에서 빠진다 — 마스터 확정 (세션 109): 2번이 혼자 맡는다"}
