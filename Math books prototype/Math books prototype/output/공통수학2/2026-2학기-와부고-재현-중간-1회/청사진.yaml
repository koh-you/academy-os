    11: {T: 3, F: 0, P: 3, R: 2, E: 3, M: 2, why: "rev16 재출제 (세션 109 후반 · ★ 5 프리미엄 승격). 종전 판정은 「매개변수 소거로 불변직선 + 퇴화 두 갈래 분류」 였고 맹검 판정 4.60 으로 프리미엄에 못 미쳤다 — 매개변수를 지우면 세 보기가 한 계산에서 함께 풀렸기 때문이다. T3 = 「접선의 길이가 같다」를 PC²-r² 의 등식으로 옮기는 것이 1겹, 그 등식에서 이차항이 지워져 남는 것이 직선이라는 것이 2겹, 그리고 a²=3/2 이 ㄴ에서는 직선이 원 C2 의 중심을 지나는 자리이고 ㄷ에서는 원점까지의 거리가 최소가 되는 자리로 같은 값이 두 얼굴을 갖는다는 것이 3겹이다. 발문은 접선의 길이 공식을 주지 않는다. F0 = 조건 서술이 정확하고 일의적이며 새 원리 학습은 없다. R2 = 「이러한 점 P 는 모두 한 직선 위에 있다」를 받아들이는 데서 끝나지 않고 그 직선을 실제로 유도해야 하며, ㄷ에서 산술평균과 기하평균의 관계를 쓸 때 등호 성립 조건을 밝혀야 곱이 나온다. E3 = 한 번 세운 l_a 의 식이 세 보기 전부에 쓰이고, ㄴ과 ㄷ이 a²=3/2 이라는 같은 값을 서로 다른 각도에서 짚어 도구 둘이 결과를 주고받는다. P3 = 종료점이 「모든 실수 a 의 값의 곱」이라 발문에서 예측되지 않고, 접점을 잡아 접선을 두 번 구하는 표준 접근으로는 답에 닿지 못한다. M2 = 벗기면 「두 원에 그은 접선의 길이가 같은 점의 자취를 구하고 그 직선족의 성질을 따지라」 가 남는다 — 접선의 길이·점과 직선 사이의 거리·절대부등식 세 도구가 결합한다. 독립 검산: d 의 최솟값을 세 경로(대입 실측 · √3 · 산술기하 등호값)로 산출해 모두 1.7320508075689 일치 · ㄱ 은 2×2+2×(1/2)=5 로 확인 · ㄴ 은 a=1 에서 두 원의 중심거리 √2 가 반지름의 차 1 과 합 3 사이에 있어 두 점에서 만남을 별도 확인. 견준 앵커 A5d"}
