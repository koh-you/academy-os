    5: {T: 2, F: 0, P: 2, R: 2, E: 2, M: 1, why: "세션 109 후반 재출제 (조건 상자 두 줄 · 값 둘). T2 = f(y,x-a)=0 에서 이동 (X,Y)↦(Y+a,X) 를 되짚는 것이 1겹, 그 이동으로 직선 2x+y-1=0 이 옮겨진 직선 x+2y-(a+1)=0 을 세우는 것이 2겹이다. 도형을 옮기는 일은 점을 옮기는 일과 치환의 방향이 반대라 둘째 겹이 첫째 겹에서 자동으로 따라 나오지 않는다. F0 = 조건 서술이 정확하고 일의적이며 새 원리 학습은 없다. P2 = 종료점이 점의 좌표라 표준이지만 그 점을 얻으려면 a 를 먼저 정해야 하고, 발문은 a 를 어디서 얻는지 말하지 않는다. R2 = |a+1|=5 에서 두 해가 나오고 (나)로 하나를 버려야 하며, 접함 조건을 중심에서 직선까지의 거리로 옮길 때 반지름이 √5 임을 확인해야 한다. E2 = a 가 옮겨진 직선의 상수항과 점을 옮기는 식 두 곳에 쓰이고, (가)가 후보를 둘로 좁히고 (나)가 하나를 남겨 두 조건이 이어져 있다. M1 = 벗기면 「방정식으로 주어진 이동을 되짚어 매개변수를 접함 조건으로 정하고 점을 옮겨라」 가 남는다 — 치환이라는 표준 접근이 그대로 통하므로 2 로 올리지 않는다. 독립 검산: a=4·a=-6 둘 다 원까지의 거리가 √5 임을 확인 · 직선 위 점 셋 (5,0)(3,1)(1,2) 를 옮겨 상직선 식에 넣어 0 확인 · 점 (4,7) 의 상이 a=4 에서 (11,4) 임을 확인"}
    6: {T: 2, F: 0, P: 2, R: 2, E: 3, M: 2, why: "세션 109 후반 재출제 (개수 층과 원소 층을 따로 두었다). T2 = (가)를 말로만 준 것을 개수 방정식 n(A-B)+n(B-A)=14 로 옮기는 것이 1겹, (나)의 두 제약을 짝수 전체 E 와 3 또는 5 의 배수 전체 T 로 옮긴 뒤 n(E∪T)=14 이므로 두 집합이 같아진다는 것이 2겹이다. 둘째 겹은 원소가 14 개인 집합이 원소가 14 개인 집합에 포함되면 같다는 관찰이고 발문에 없다. F0 = 조건 서술이 정확하고 일의적이다. P2 = 종료점이 「개수 + 원소의 합」이라 개수만 다루는 표준 유형과 어긋나지만, 최댓값을 묻는 것 자체는 표준이라 3 은 아니다. R2 = j 가 유일함을 밝혀야 한다 — 8+j ≤ 13 이고 2(12-j) ≥ 14 이므로 배수가 되려면 두 수가 같아야 한다는 논증이 필요하고, 이를 건너뛰고 여섯 경우를 훑으면 노동만 늘어난다. E3 = E∩T 의 다섯 원소가 개수 판정과 합의 최대화 양쪽에 쓰이고, (가)의 두 3 이 개수 방정식과 n(A)·n(B) 양쪽에 들어가며, (나)의 「또는」이 없으면 n(E∪T)=13<14 라 해가 사라진다. 어느 하나를 빼도 답이 결정되지 않는다. M2 = 벗기면 「두 제약이 원소를 남김없이 배정하도록 강제됨을 보이고 남는 자유에서 개수와 합을 되짚어라」 가 남는다 — 개수만 다루는 표준 접근으로는 S 가 나오지 않는다. 독립 검산: A-B 를 E 의 부분집합 전체, B-A 를 T 의 부분집합 전체로 놓고 서로소·원소 수 합 14·n(B)|n(A) 를 만족시키는 짝을 전수로 훑음 — 남은 것 10 가지 · n(A) 는 모두 10 · A-B 의 합은 60 부터 82 까지 · 합이 82 일 때 A-B={2,4,8,14,16,18,20}"}
    7: {T: 2, F: 0, P: 2, R: 2, E: 2, M: 1, why: "세션 109 후반 재출제 (미지수를 k 하나에서 k·r 둘로). T2 = 일반형을 표준형으로 복원해 중심이 (k,k) 이고 반지름이 r 임을 세우는 것이 1겹, 「넓이를 이등분한다」를 「중심을 지난다」로 옮기고 다시 「두 점 A, B 가 원 C2 위에 있으므로 선분 AB 가 지름」으로 잇는 것이 2겹이다. 둘째 겹의 뒷마디를 발문이 알려 주지 않는다. F0 = 조건 서술이 정확하고 일의적이며 새 원리 학습은 없다. P2 = 종료점이 k+r 이라 두 값을 따로 구해야 함이 드러나지만, 어느 조건이 어느 값을 주는지는 보이지 않는다. R2 = 구한 두 값이 두 원이 서로 다른 두 점에서 만나는 범위 안에 드는지(4<4√2<8) 되돌아가 확인해야 논증이 끝나고, 양수라는 단서로 k 의 두 해 중 하나를 버려야 한다. E2 = 두 값이 서로 다른 원에서 나오고 순서를 바꿀 수 없다 — r 를 먼저 얻어야 C1 쪽 식을 세운다. 조건 (가)가 r 쪽을, (나)가 두 곳을 함께 정한다. M1 = 벗기면 「두 원의 공통현이 작은 원의 지름이 되도록 두 매개변수를 정하라」 가 남는다 — 두 식을 빼서 공통현을 얻는 표준 접근이 그대로 통하므로 2 로 올리지 않는다. 독립 검산: (4/2)²+2·4²=36 확인 · 두 중심 사이의 거리 4√2 가 |6-2| 와 6+2 사이임을 확인 · k=4,r=2 에서 공통현이 x+y=8 이고 중심 (4,4) 를 지남을 확인 · x²+y²=36 과 연립해 교점 (4±√2, 4∓√2) 를 얻고 그 거리가 4 임을 확인"}
    8: {T: 2, F: 0, P: 2, R: 1, E: 1, M: 2, why: "[M=2] 243 가지라 전수 불가 · 세 상태 대응 + 포함배제 둘 다 필수. rev10 재출제 · 합집합이 지정되었다는 조건을 각 원소가 A에만 속하거나 B에만 속하거나 양쪽에 속하는 세 상태 중 하나라는 분류로 옮기고 차집합의 원소 개수 조건을 그 분류 위의 세기로 되받는 번역이 통찰 · 서술 일의적 · 부분집합의 개수를 세는 표준 드릴이 통하지 않고 세는 대상이 집합이 아니라 두 집합의 순서쌍이라 종료점이 낯설다 · 두 사건이 겹치는 경우를 빼야 함을 확인해야 하고 순서쌍이므로 A와 B의 역할을 구분해야 한다 · 제약은 합집합 지정과 차집합 개수 두 개이고 앞이 세는 범위를 정하고 뒤가 걸러내는 한 방향으로만 쓰여 6번처럼 두 조건이 상한과 하한을 양쪽에서 결정하는 재사용은 없다"}
    9: {T: 2, F: 0, P: 2, R: 2, E: 2, M: 1, why: "세션 109 후반 재출제 (조건 셋 · 값 둘 · 도구 둘). T2 = 「~q 이면 ~p 이다」를 대우로 뒤집어 진리집합의 포함 관계 P⊂Q 로 옮기는 것이 1겹, 「조건 p 그리고 r 를 만족시키는 x 가 존재하지 않는다」를 P∩R=∅ 으로 옮기는 것이 2겹이다. 뒤엣것은 존재를 부정하는 서술이라 앞엣것과 다루는 결이 다르다. F0 = 조건 서술이 정확하고 일의적이며 새 원리 학습은 없다. P2 = 종료점이 「a 의 값과 b 의 최솟값의 합」이라 표준 유형과 어긋나지만, 진리집합을 세우는 도구 자체는 발문에서 보인다. R2 = r 의 진리집합이 b 와 6 의 대소로 세 모양(열린 구간 둘과 공집합)으로 나뉘므로 b≥6 인 경우를 따로 지워야 하고, 경계 b=4 에서 R 가 열린 구간이라 4 가 R 에 속하지 않음을 확인해야 최솟값이 닫힌다. E2 = (나)가 (가)에서 얻은 P=[-2,4] 를 재료로 쓰고, 두 조건이 각각 a 와 b 를 정한다. 두 구간의 길이가 모두 6 이라 (가)에서 양 끝이 동시에 맞물려 a 가 하나로 정해진다. M1 = 벗기면 「세 이차부등식의 진리집합에 포함 관계와 서로소 조건을 걸어 두 매개변수를 정하라」 가 남는다 — 진리집합을 그려 견주는 표준 접근이 그대로 통하므로 2 로 올리지 않는다. 독립 검산: a=1 에서 P 의 두 끝 -2·4 가 Q 의 두 끝과 일치함을 확인 · b=4 에서 P∩R 가 비고 b=3.9·3.99 에서 비지 않음을 확인"}
