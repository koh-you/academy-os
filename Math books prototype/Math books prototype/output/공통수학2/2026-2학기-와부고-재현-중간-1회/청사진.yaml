  - {n: 9,  points: 5.2, unit: CM2-ST, subunit: [S03, S04], difficulty: 상,  signature: S10,       insight: [I-EQV, I-CON], choice_type: 일반, standard: 10수06-03, primary_tool: ST-06, cm2_scope: in, role: "rev18 재출제 (세션 109 후반 · 마스터 승인) — 조건을 둘에서 셋으로 늘리고 묻는 값을 둘로 나눴다 (③ 5 = a 의 값 1 + b 의 최솟값 4). 종전은 명제 하나와 그 역만 다뤄 진리집합 포함 관계라는 도구 하나로 끝났다. 두 값이 서로 다른 도구에서 나온다 — (가)는 대우로 뒤집어 포함 관계 P⊂Q 를 세우고 두 구간의 길이가 모두 6 이라 양 끝이 동시에 맞물려 a=1 이 하나로 정해진다. (나)는 교집합이 공집합이라는 조건을 쓴다. 포함 관계는 양 끝을 안으로 밀어 넣는 일이고 교집합이 비는 조건은 두 구간을 떼어 놓는 일이다. (나)는 (가)에서 얻은 P=[-2,4] 를 재료로 쓴다. r 의 진리집합이 b 와 6 의 대소로 세 모양(열린 구간 둘과 공집합)으로 나뉜다는 것을 발문이 알려 주지 않고, 한쪽이 열린 구간이라 경계 b=4 가 답에 들어간다. 🔴 종전 발문에 있던 「이」를 쓰지 않는다 — 정규 과정은 역과 대우만 다룬다. 🔴 15번이 종전에 쓰던 「충분조건」 어법과 겹치지 않게 대우 어법으로 두었다. S10 커버리지 유지. 이전 rev15 사유 기록: 맹검 판정 2.40 으로 전 슬롯 최저여서 교체. 종전 '명제와 그 역·이·대우 중 참인 것의 개수 (② 2)' 는 진리집합 두 개를 구해 포함 관계를 보면 끝났다. 참·거짓을 먼저 주고 매개변수 a 의 범위를 되짚는 방향으로 뒤집었다 (① 2≤a<4). 통찰 둘을 학생이 스스로 만든다 — 넷(명제·역·이·대우)이 둘로 접힌다는 것, 그리고 p 의 진리집합이 a 와 2 의 대소로 세 모양으로 나뉜다는 것. 후자를 발문이 알려 주지 않는다. 경계 둘(a=2 에서 진리집합이 한 점 · a=4 에서 두 진리집합이 같아져 역이 참)을 확인해야 답이 닫힌다. S10 커버리지 유지"}
  - {n: 10, points: 5.3, unit: CM2-GM, subunit: G02, difficulty: 상,  signature: S2,        insight: [I-CON, I-SYM], choice_type: 일반, standard: 10수05-02, primary_tool: GM-06, cm2_scope: in, role: "rev9 mechanism 교체 — 서로 수직인 두 직선까지의 거리의 합이 일정한 점의 자취를 절댓값 방정식으로 옮긴 뒤, 네 경계 직선이 이루는 정사각형의 넓이로 되받는다. 종전 '직선 위 점으로 이등변삼각형 → 개수'는 예상 1회 Q10(이등변 → n+M)의 S4 제거판이어서 S4를 되돌리면 자기복제가 완성되는 구조 → 이등변 케이스분류 자체를 폐기. S4 커버리지는 #6(M+N)이 담당하므로 D2 불변"}
  - {n: 11, points: 5.4, unit: CM2-GM, subunit: G03, difficulty: 최상, signature: [S11, S13], insight: [I-CON, I-PD], choice_type: 보기형, standard: 10수05-03, primary_tool: GM-04, cm2_scope: in, role: "rev16 재출제 (세션 109 후반 · ★ 5 프리미엄 승격) — 맹검 판정 4.60 으로 프리미엄에 못 미쳐 교체. 종전 '문자 두 점의 내분점 → 직선 대칭이동 → 문자 소거로 불변직선 (⑤ ㄱ,ㄴ,ㄷ)' 은 매개변수를 지우면 세 보기가 한 계산에서 함께 풀렸다. 🔴 교체의 직접 이유가 하나 더 있다 — 구 보기 ㄴ 「점 Q 는 t 의 값에 관계없이 항상 직선 3x+y=3 위에 있다」가 실기출 W28 의 보기 ㄷ 「점 G 는 a 의 값에 관계없이 항상 직선 59x-63y+59=0 위에 존재한다」와 문장 짜임이 그대로 겹쳤다 (복제 4축 ②기호 조합·③발문 문장). 새 문항은 두 원 C1·C2 의 밖의 점에서 그은 두 접선의 길이가 같은 점이 만드는 직선 l_a (③ ㄱ,ㄷ). 관문은 「접선의 길이」를 PC²-r² 으로 옮기면 이차항이 지워져 직선만 남는다는 한 줄이고 발문이 그 식을 주지 않는다. a²=3/2 이라는 같은 값이 ㄴ(직선이 C2 의 중심을 지난다)과 ㄷ(원점까지의 거리가 최소)에 두 번 나와 도구 둘이 결과를 주고받는다. 종료점은 「모든 실수 a 의 값의 곱」으로 개수 세기가 아니다. 🔴 선택지 배열 교체 {ㄱ}{ㄴ}{ㄱ,ㄷ}{ㄴ,ㄷ}{ㄱ,ㄴ,ㄷ} — 새 정답이 ㄱ,ㄷ 이다. 🔴 시그니처 S2(불변량·자취)·S3(대칭)이 이 슬롯에서 빠진다 — 10번이 S2 를, 5번·14번이 대칭이동 도구를 맡는다. 견준 앵커는 A5d (블랙라벨 CM2-CH05 명제 STEP3 #07 · 보기형 · 계수 역순과 고정점을 스스로 세운다)"}
  - {n: 12, points: 5.5, unit: CM2-ST, subunit: S05, difficulty: 상,  signature: S13,       insight: I-CON, choice_type: 일반, standard: 10수05-02, primary_tool: GM-02, cm2_scope: in, role: "rev9 강화 — 산술·기하평균으로 삼각형 OAB 넓이의 최솟값을 잡는 데서 끝내지 않고, 그 **등호 성립 조건**이 정하는 두 절편에서 PA·PB 를 되받는 2단 구조. 하한만 답하면 도달 불가. 종전 조건 (나)('x축·y축과 각각 양의 부분에서 만난다')는 (가)+기울기 음수로부터 자동 성립하는 위장 제약(§1.7 N2)이어서 삭제하고, (가)(나)를 실질 제약 2개로 재편"}

  # ─── 서술형 5문 (과정 강제·계단식) ───
  - {n: 13, points: 6.0, unit: CM2-GM, subunit: [G01, G02], difficulty: 상,  signature: S5,   insight: [I-CON, I-BW], standard: 10수05-02, primary_tool: GM-02, cm2_scope: in, role: "rev18 재출제 (세션 109 후반 · 마스터 승인) — 종전 '두 점에서 같은 거리 + 넓이 15 → H 와 P 를 구하시오 (H(2,1)·P(-1,7))' 는 두 값이 한 도구에서 나왔다. (가) PO=PA 가 점 P 를 선분 OA 의 수직이등분선 위에 올려놓고, 수직이등분선은 선분 OA 와 중점에서 수직으로 만나므로 수선의 발 H 가 (나)를 읽기도 전에 중점으로 정해졌다. 남은 P 도 같은 직선 위에서 잡는 일이라 조건 두 줄이 같은 층에 있었고 물음 둘 중 하나가 나머지의 부산물이었다. 새 문항은 두 값을 서로 다른 도구에서 뽑는다 (P(5,0) · x+2y-5=0). 앞은 넓이를 「밑변 AB · 높이 = 점과 직선 사이의 거리」로 옮겨 절댓값 방정식을 만들고 두 후보 중 하나를 (나)의 두 점 사이의 거리 비교로 남긴다. 뒤는 「넓이를 이등분한다」를 「선분 AB 의 중점을 지난다」로 옮긴 뒤 두 점을 지나는 직선을 세운다. 앞은 점에서 직선까지의 거리를 재는 일이고 뒤는 선분을 반으로 나눈 점을 잡는 일이다. 종전과 반대로 뒤 물음이 앞 답을 재료로 쓴다 — 중점 (1,2) 는 P 를 몰라도 나오지만 직선은 P 가 정해져야 나온다. 🔴 종전 13번의 수직이등분선은 16번의 외심과 결이 겹쳤다. 새 13번은 그 결을 버리고 중점만 쓴다. 🔴 그림을 넣지 않는다 — x 축 위의 두 후보 자리가 그림에 드러난다. S5(넓이 원리 유도) 커버리지 유지 — 넓이가 조건으로 주어져 밑변·높이로 세우는 길만 남고 신발끈은 쓸 자리가 없다. 이전 rev15 사유 기록: 맹검 판정 3.50 으로 목표 미달이어서 교체. 종전 '수선의 발 H 의 좌표와 삼각형 넓이를 구하시오' 는 할 일이 발문에 그대로 적혀 있었다. 넓이를 15 로 주고 점을 되짚는 방향으로 뒤집었다 (H(2,1)·P(-1,7)). 통찰은 조건 (가) PO=PA 를 선분 OA 의 수직이등분선으로 옮기고, 그 결과 수선의 발이 밑변의 중점임을 스스로 세우는 것이다. t 가 둘 나오는 것을 제2사분면 조건으로 하나만 남긴다. 🔴 점 이름을 B 에서 P 로 바꿨다 — 실기출 #13 과의 기호 조합 겹침(복제 4축 ②)을 지우기 위해서다. S5(넓이 원리 유도) 커버리지 유지 — 넓이가 조건으로 주어지므로 밑변과 높이로 세우는 길만 남고 신발끈은 쓸 자리가 없다"}
